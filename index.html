/* ============================================================
   LOG (events) - repair / maintenance / improvement history with photos.
   ============================================================ */
function StoredImg({ path, onRemove }){
  const [url, setUrl] = useState("");
  useEffect(() => { let ok=true; signFile(path).then(u=>{ if(ok) setUrl(u); }).catch(()=>{}); return ()=>{ ok=false; }; }, [path]);
  return (
    <div className="thumb">
      {url ? <img src={url} alt="" /> : <div className="thumb-ph"><span className="spin"></span></div>}
      {onRemove && <button className="thumb-x" onClick={(e)=>{ e.stopPropagation(); onRemove(); }}><Icon d={ICONS.x} size={13}/></button>}
    </div>
  );
}

function EventSheet({ event, draft, homeId, systems, documents, onCreateSystem, onAttachReceipt, onSave, onDelete, onClose }){
  const seed = event || draft || null;   // draft = prefilled-but-unsaved (e.g. from a receipt)
  const [id] = useState(() => (seed && seed.id) || uid());
  const [title, setTitle] = useState(seed ? (seed.title||"") : "");
  const [category, setCategory] = useState(seed ? (seed.category||"Repair") : "Repair");
  // An EXISTING entry keeps what it has, including NO date (an imported card whose
  // source carried none) - opening it must not silently stamp it with today.
  const [date, setDate] = useState(event ? (event.date||"") : (seed ? (seed.date||todayStr()) : todayStr()));
  const [systemId, setSystemId] = useState(seed ? (seed.system_id||"") : "");
  const [cost, setCost] = useState(seed && seed.cost!=null ? String(seed.cost) : "");
  const [vendor, setVendor] = useState(seed ? (seed.vendor||"") : "");
  const [notes, setNotes] = useState(seed ? (seed.notes||"") : "");
  const [photos, setPhotos] = useState(event && event.photos ? event.photos : []);
  const [receipt, setReceipt] = useState(() => (seed && seed.receipt) || null);   // {docId, path, name}
  const [attaching, setAttaching] = useState(false);
  const [pickDoc, setPickDoc] = useState(false);
  const [docQ, setDocQ] = useState("");
  const [uploading, setUploading] = useState(false);
  const [err, setErr] = useState("");
  const fileRef = useRef(null);

  const onPick = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if(!files.length) return;
    setUploading(true); setErr("");
    try{
      for(const f of files){
        const b64 = await resizeImage(f);
        const path = "events/"+id+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+".jpg";
        await uploadFile(path, b64);
        setPhotos(p => [...p, path]);
      }
    }catch(ex){ setErr(ex.message || "Photo upload failed."); }
    finally{ setUploading(false); }
  };
  const removePhoto = (path) => { setPhotos(p => p.filter(x=>x!==path)); deleteFile(path); };

  const save = () => {
    if(!title.trim()) return;
    onSave({
      id, home_id: homeId, title: title.trim(), category, date: date || null,
      system_id: systemId || null, job_id: (seed && seed.job_id) || null,
      cost: cost.trim()==="" ? null : (Number(cost) || 0),
      vendor: vendor.trim(), notes: notes.trim(), photos,
      receipt: receipt || null,
      createdAt: event ? event.createdAt : nowISO(), updatedAt: nowISO(),
    });
  };

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">{event ? "Edit entry" : "Log an entry"}</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>

        <div className="title-field">
          <label className="label">What happened</label>
          <input className="title-input" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Replaced the water heater" autoFocus />
        </div>

        <div className="field">
          <label className="label">Category</label>
          <div className="pills">
            {EVENT_CATEGORIES.map(c =>
              <button key={c.k} className={"pill "+(category===c.k?"on":"")} onClick={()=>setCategory(c.k)}>{c.k}</button>)}
          </div>
        </div>

        <div className="row">
          <div className="field">
            <label className="label">Date</label>
            <input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
          <div className="field">
            <label className="label">Cost</label>
            <input className="input" type="number" inputMode="decimal" value={cost} onChange={e=>setCost(e.target.value)} placeholder="$ optional" />
          </div>
        </div>

        <div className="field">
          <label className="label">Vendor / who did it</label>
          <input className="input" value={vendor} onChange={e=>setVendor(e.target.value)} placeholder="Optional" />
        </div>

        {/* Tie the work to the actual equipment, so each unit builds its own
            service history instead of everything landing on "the house". */}
        {systems && systems.length > 0 &&
          <div className="field">
            <label className="label">Which system</label>
            <SystemPicker systems={systems} value={systemId} onChange={setSystemId} placeholder="Not tied to one"
              onCreate={onCreateSystem ? (t)=>onCreateSystem(t, homeId) : null} />
          </div>}

        <div className="field">
          <label className="label">Notes</label>
          <textarea className="textarea" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Details, part numbers, warranty info..." />
        </div>

        {/* The invoice is a document, not a snapshot of the visit. Kept separate
            from the photos below so neither has to stand in for the other. */}
        <div className="field">
          <label className="label">Invoice or receipt</label>
          {receipt ? (
            <div style={{display:"flex", gap:8}}>
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>openStoredFile(receipt.path, setErr)}>
                <Icon d={ICONS.external} size={16}/> {receipt.name || "Open"}
              </button>
              <button className="assist-toggle" style={{marginTop:0}} onClick={()=>setReceipt(null)}>Remove</button>
            </div>
          ) : (
            <>
              <label className="btn btn-ghost btn-block" style={{cursor:"pointer"}}>
                <Icon d={ICONS.upload} size={16}/> {attaching ? "Filing…" : "Attach a file or photo"}
                {/* pdf + image, no capture attribute: iOS then offers Photo
                    Library, Take Photo and Choose File all from one control */}
                <input type="file" accept="application/pdf,image/*" style={{display:"none"}} disabled={attaching}
                  onChange={async e => { const f=(e.target.files||[])[0]; e.target.value="";
                    if(!f || !onAttachReceipt) return;
                    setAttaching(true); setErr("");
                    try{ const rec = await onAttachReceipt(f); if(rec) setReceipt(rec); else setErr("Couldn't file that."); }
                    catch(err){ setErr(err.message || "Couldn't file that."); }
                    setAttaching(false); }} />
              </label>
              <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>setPickDoc(v=>!v)}>
                <Icon d={ICONS.doc} size={16}/> {pickDoc ? "Cancel" : "Pick from my documents"}
              </button>
              {pickDoc &&
                <>
                  <input className="input" style={{marginTop:8}} value={docQ} autoFocus
                    onChange={e=>setDocQ(e.target.value)} placeholder="Search documents" />
                  <div className="list" style={{marginTop:6, maxHeight:"26vh", overflowY:"auto"}}>
                    {(documents||[])
                      .filter(d => { const q=docQ.trim().toLowerCase();
                        return !q || ((d.name||"")+" "+(d.sourceName||"")).toLowerCase().includes(q); })
                      .slice(0, 40)
                      .map(d => (
                        <button key={d.id} className="item" onClick={()=>{
                          setReceipt({ docId:d.id, path:d.path, name:d.name }); setPickDoc(false); }}>
                          <div className="item-body">
                            <div className="item-title">{d.name}</div>
                            <div className="item-meta">
                              <span className="chip">{migrateDocCat(d.category)}</span>
                              <span className="chip">{fileKind(d.path, d.mime)}</span>
                            </div>
                          </div>
                        </button>
                      ))}
                  </div>
                </>}
              <div className="hint">Take a photo, pick one from your library, choose a PDF, or point at a document you have already filed.</div>
            </>
          )}
        </div>

        <div className="field">
          <label className="label">Photos of the work</label>
          <div className="photos-grid">
            {photos.map(p => <StoredImg key={p} path={p} onRemove={()=>removePhoto(p)} />)}
            <button className="add-photo" onClick={()=>fileRef.current && fileRef.current.click()} disabled={uploading}>
              {uploading ? <span className="spin"></span> : <><Icon d={ICONS.camera} size={20}/>Add</>}
            </button>
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={onPick} />
          {err && <div className="assist-msg">{err}</div>}
        </div>

        <button className="btn btn-primary btn-block" onClick={save} disabled={!title.trim()}>
          {event ? "Save changes" : "Log it"}
        </button>
        {event &&
          <button className="btn btn-danger btn-block" style={{marginTop:10}}
            onClick={()=>{ if(confirm("Delete this log entry?")) onDelete(event.id); }}>
            Delete entry
          </button>}
      </div>
    </>
  );
}

function OpenIssues({ store, home, onOpenJob, onNewJob, onDeleteJob }){
  const jobs = (store.data.jobs||[]).filter(j => j.home_id === home.id);
  const open = jobs.filter(isJobOpen)
    .sort((a,b)=> String(b.openedAt||"").localeCompare(String(a.openedAt||"")));
  const sysName = {};
  (store.data.systems||[]).forEach(s => { sysName[s.id] = s.title; });
  const spendOf = (jid) => (store.data.events||[])
    .filter(e => e.job_id === jid).reduce((s,e)=> s + (Number(e.cost)||0), 0);
  if(!open.length) return null;
  return (
    <div style={{marginBottom:6}}>
      <div className="set-group">Open {open.length===1?"issue":"issues"}</div>
      <div className="list" style={{marginTop:0}}>
        {open.map(j => <JobRow key={j.id} j={j} systemName={j.system_id ? sysName[j.system_id] : ""}
          spend={spendOf(j.id)} onOpen={onOpenJob} onDelete={onDeleteJob} />)}
      </div>
    </div>
  );
}

function LogScreen({ store, home, onAdd, onEdit, onDelete, onAddReceipt, onImportTrello, onClearImportedDates,
                    onOpenJob, onNewJob, onDeleteJob }){
  const events = (store.data.events||[])
    .filter(e => e.home_id === home.id)
    .sort((a,b)=> String(b.date||"").localeCompare(String(a.date||"")) || String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  // Entries imported before v0.21.0 were stamped with the import date because
  // there was no "no date" state. Same detection as the Reminders screen.
  const misdated = events.filter(e => e.source === "trello" && e.date && e.createdAt &&
                                      e.date === String(e.createdAt).slice(0,10));
  if(!events.length){
    // An open issue with no visits logged against it yet still belongs on this
    // screen: saying "nothing logged" while something is actively broken reads
    // as though the issue was lost.
    return (
      <div>
        <OpenIssues store={store} home={home} onOpenJob={onOpenJob} onNewJob={onNewJob} onDeleteJob={onDeleteJob} />
        <div className="empty">
          <div className="glyph">+</div>
          <h3 className="title-sm">Nothing logged yet</h3>
          <p>Log a repair, maintenance job, improvement, or inspection for {home.name} — with photos and cost.</p>
          <button className="btn btn-primary" style={{marginTop:18}} onClick={onAdd}><Icon d={ICONS.plus} size={16}/> Log an entry</button>
          <button className="btn btn-ghost" style={{marginTop:10}} onClick={onNewJob}><Icon d={ICONS.tool} size={16}/> Report something broken</button>

function ReminderSheet({ reminder, preset, homeId, onSave, onDelete, onClose }){
  const base = reminder || preset || null;
  const [id] = useState(() => reminder ? reminder.id : uid());
  const [title, setTitle] = useState(base ? (base.title||"") : "");
  const [category, setCategory] = useState(base && base.category ? base.category : "Maintenance");
  // An existing reminder keeps whatever it has - including NO date (imported
  // to-dos), so merely opening one can't silently schedule it for today.
  const [dueDate, setDueDate] = useState(reminder ? (reminder.dueDate||"") : todayStr());
  const [repeat, setRepeat] = useState(base ? !!base.repeat : false);
  const [every, setEvery] = useState(base && base.every ? String(base.every) : "3");
  const [unit, setUnit] = useState(base && base.unit ? base.unit : "months");
  const [notes, setNotes] = useState(reminder ? (reminder.notes||"") : "");

  const save = () => {
    if(!title.trim()) return;
    onSave({
      id, home_id: homeId, title: title.trim(), category,
      // A repeating reminder needs an anchor date; a one-off may stay undated.
      dueDate: dueDate || (repeat ? todayStr() : null),
      repeat,
      every: repeat ? Math.max(1, Number(every)||1) : null,
      unit:  repeat ? unit : null,
      notes: notes.trim(),
      doneAt:     reminder ? (reminder.doneAt||null) : null,
      lastDoneAt: reminder ? (reminder.lastDoneAt||null) : null,
      createdAt:  reminder ? reminder.createdAt : nowISO(),
      updatedAt:  nowISO(),
    });
  };

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">{reminder ? "Edit reminder" : "New reminder"}</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>

        <div className="title-field">
          <label className="label">What needs doing</label>
          <input className="title-input" value={title} onChange={e=>setTitle(e.target.value)}
            placeholder="e.g. Replace HVAC filter" autoFocus />
        </div>

        <div className="field">
          <label className="label">Category</label>
          <div className="pills">
            {EVENT_CATEGORIES.map(c =>
              <button key={c.k} className={"pill "+(category===c.k?"on":"")} onClick={()=>setCategory(c.k)}>{c.k}</button>)}
          </div>
        </div>

        <div className="field">
          <label className="label">{repeat ? "First due" : "Due"}</label>
          <input className="input" type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} />
        </div>

        <div className="field">
          <label className="label">Repeats</label>
          <div className="pills">
            <button className={"pill "+(!repeat?"on":"")} onClick={()=>setRepeat(false)}>One time</button>
            <button className={"pill "+(repeat?"on":"")} onClick={()=>setRepeat(true)}>Repeats</button>
          </div>
          {repeat &&
            <div className="row" style={{marginTop:12}}>
              <div className="field" style={{flex:"0 0 96px", marginBottom:0}}>
                <input className="input" type="number" inputMode="numeric" min="1" value={every}
                  onChange={e=>setEvery(e.target.value)} />
              </div>
              <div className="field" style={{flex:1, marginBottom:0}}>
                <select className="select" value={unit} onChange={e=>setUnit(e.target.value)}>
                  {REPEAT_UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                </select>
              </div>
            </div>}
          {repeat && <div className="hint">Reschedules from the day you mark it done, so falling behind never leaves it permanently overdue.</div>}
        </div>

        <div className="field">
          <label className="label">Notes</label>
          <textarea className="textarea" value={notes} onChange={e=>setNotes(e.target.value)}
            placeholder="Filter size, part number, who to call..." />
        </div>

        <button className="btn btn-primary btn-block" onClick={save} disabled={!title.trim()}>
          {reminder ? "Save changes" : "Add reminder"}
        </button>
        {reminder &&
          <button className="btn btn-danger btn-block" style={{marginTop:10}}
            onClick={()=>{ if(confirm("Delete this reminder?")) onDelete(reminder.id); }}>
            Delete reminder
          </button>}
      </div>
    </>
  );
}

function ReminderRow({ r, onEdit, onComplete, onDelete }){
  const st = remStatus(r);
  const n = daysUntil(r.dueDate);
  const due =
    st === "done"    ? "Completed" :
    st === "undated" ? "No date set" :
    st === "today"   ? "Due today" :
    st === "overdue" ? (n === -1 ? "1 day overdue" : Math.abs(n) + " days overdue") :
    n === 1          ? "Due tomorrow" : "Due in " + n + " days";
  const rep = repeatLabel(r);
  return (
    <SwipeRow onDelete={()=>onDelete(r)}>
      <div className={"item" + (st==="overdue" ? " overdue" : "") + (st==="done" ? " muted" : "")}>
        <button className="rem-body" onClick={()=>onEdit(r)}>
          <div className="item-title">{r.title}</div>
          <div className="item-meta">
            <span className={"chip "+catClass(r.category)}>{r.category}</span>
            <span className={"chip"+(st==="overdue" ? " red" : "")}>{due}</span>
            {r.dueDate && st!=="done" && <span className="chip">{fmtDate(r.dueDate)}</span>}
            {rep && <span className="chip">{rep}</span>}
          </div>
        </button>
        <button className="rem-done" onClick={()=>onComplete(r)}
          aria-label={st==="done" ? "Reopen reminder" : "Mark done"}>
          <Icon d={st==="done" ? ICONS.undo : ICONS.check} size={17}/>
        </button>
      </div>
    </SwipeRow>
  );
}

function RemindersScreen({ store, home, onAdd, onEdit, onComplete, onDelete, onClearImportedDates }){
  const all = (store.data.reminders||[]).filter(r => r.home_id === home.id);
  // Reminders imported before v0.19.0 were stamped with the import date because
  // there was no "undated" state. Spot them (source trello + due date == the day
  // they were created) and offer a one-tap fix rather than 35 manual edits.
  const misdated = all.filter(r => r.source === "trello" && !r.doneAt && r.dueDate &&
                                   r.createdAt && r.dueDate === String(r.createdAt).slice(0,10));

  if(!all.length){
    return (
      <div className="empty">
        <div className="glyph">!</div>
        <h3 className="title-sm">Nothing scheduled yet</h3>
        <p>Stay ahead of the work at {home.name}. Tap a common one to start, or add your own.</p>
        <div className="pills" style={{justifyContent:"center", marginTop:18}}>
          {REMINDER_PRESETS.map(p =>
            <button key={p.title} className="pill" onClick={()=>onAdd(p)}>{p.title}</button>)}
        </div>
        <button className="btn btn-primary" style={{marginTop:18}} onClick={()=>onAdd(null)}>
          <Icon d={ICONS.plus} size={16}/> Add a reminder
        </button>
      </div>
    );
  }

  const byDue = (a,b) => String(a.dueDate||"").localeCompare(String(b.dueDate||""));
  const open = all.filter(r => !r.doneAt);
  const pick = (s) => open.filter(r => remStatus(r) === s).sort(byDue);
  const groups = [
    ["Overdue",      pick("overdue")],
    ["Today",        pick("today")],
    ["Next 30 days", pick("soon")],
    ["Later",        pick("later")],
    ["No date set",  pick("undated")],
    ["Completed",    all.filter(r => r.doneAt).sort((a,b)=>String(b.doneAt||"").localeCompare(String(a.doneAt||"")))],
  ].filter(g => g[1].length);

  const overdueN = pick("overdue").length;
  const soonN = pick("today").length + pick("soon").length;

  return (
    <div>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
        <div className="log-summary">
          {overdueN > 0 ? overdueN + " overdue" : "Nothing overdue"}
          {soonN > 0 ? " · " + soonN + " due soon" : ""}
        </div>
        {misdated.length > 0 &&
          <button className="assist-toggle" style={{marginTop:14, whiteSpace:"nowrap"}}
            onClick={()=>onClearImportedDates("reminders","dueDate",misdated)}>Clear {misdated.length} imported date{misdated.length===1?"":"s"}</button>}
      </div>
      {misdated.length > 0 &&
        <div className="hint" style={{marginBottom:6}}>
          {misdated.length} imported reminder{misdated.length===1?"":"s"} got today's date because the source card had none. Clearing moves them to "No date set" so they stop looking due.
        </div>}
      {groups.map(g => (
        <div key={g[0]}>
          <div className="set-group">{g[0]}</div>
          <div className="list" style={{marginTop:0}}>
            {g[1].map(r => <ReminderRow key={r.id} r={r} onEdit={onEdit} onComplete={onComplete} onDelete={onDelete} />)}
          </div>
        </div>
      ))}
    </div>
  );
}

// Open a stored file in a new tab. The blank tab is opened SYNCHRONOUSLY inside
// the click so Safari/iOS doesn't treat the post-await window.open as a popup.
async function openStoredFile(path, onErr){
  let w = null;
  try { w = window.open("about:blank", "_blank"); } catch(e){}
  try {
    const url = await signFile(path);
    if(w) w.location = url; else window.location.href = url;
  } catch(e){
    if(w) { try{ w.close(); }catch(_){ } }
    log("ERROR","openStoredFile: "+e.message);
    if(onErr) onErr("Could not open that document.");
  }
}

function DocSheet({ doc, homeName, onSave, onDelete, onClose, onOpen, onExtract, onApply }){
  const [name, setName] = useState(doc ? (doc.name||"") : "");
  const [category, setCategory] = useState(doc ? migrateDocCat(doc.category) : "Other");
  const [note, setNote] = useState(doc ? (doc.note||"") : "");
  const [extract, setExtract] = useState(doc && doc.extracted ? doc.extracted : null);
  const [reading, setReading] = useState(false);
  const [exErr, setExErr] = useState("");
  const [applied, setApplied] = useState(false);
  if(!doc) return null;

  const save = () => {
    if(!name.trim()) return;
    onSave({ ...doc, name: name.trim(), category, note: note.trim(), updatedAt: nowISO() });
  };

  const runExtract = async () => {
    setReading(true); setExErr(""); setApplied(false);
    try {
      const res = await onExtract(doc);        // { documentType, summary, fields }
      setExtract(res);
      if(!res || !res.fields || !Object.keys(res.fields).length)
        setExErr("No property facts found in this document.");
    } catch(e){ setExErr(e.message || "Couldn't read that document."); }
    finally { setReading(false); }
  };

  const foundRows = extract && extract.fields
    ? EXTRACT_FIELDS.filter(([k]) => extract.fields[k] != null && extract.fields[k] !== "")
    : [];

  const apply = () => {
    onApply(doc, extract.fields);
    setApplied(true);
  };

  const canRead = fileKind(doc.path, doc.mime) !== "File";   // PDF or image only

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">Document</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>

        <button className="btn btn-ghost btn-block" style={{marginBottom:16}} onClick={()=>onOpen(doc)}>
          <Icon d={ICONS.external} size={17}/> Open {fileKind(doc.path, doc.mime) === "PDF" ? "PDF" : "file"}
        </button>

        <div className="title-field">
          <label className="label">Name</label>
          <input className="title-input" value={name} onChange={e=>setName(e.target.value)} autoFocus />
        </div>

        <div className="field">
          <label className="label">Category</label>
          <div className="pills">
            {DOC_CATEGORIES.map(c =>
              <button key={c.k} className={"pill "+(category===c.k?"on":"")} onClick={()=>setCategory(c.k)}>{c.k}</button>)}
          </div>
        </div>

        <div className="field">
          <label className="label">Note</label>
          <textarea className="textarea" value={note} onChange={e=>setNote(e.target.value)}
            placeholder="Anything worth remembering about this document..." />
        </div>

        {canRead &&
          <div className="field">
            <label className="label">Read with AI</label>
            {!extract &&
              <>
                <button className="btn btn-ghost btn-block" onClick={runExtract} disabled={reading}>
                  {reading ? <span className="spin"></span> : <><Icon d={ICONS.doc} size={16}/> Pull details into {homeName || "this home"}</>}
                </button>
                <div className="hint" style={{marginTop:8}}>
                  Reads a closing disclosure, survey, or title commitment and pulls out the purchase price, loan, closing date, and lot details.
                </div>
              </>}
            {extract &&
              <div className="assist-msg" style={{marginTop:0}}>
                {extract.documentType && <div style={{fontWeight:600, marginBottom:4}}>{extract.documentType}</div>}
                {extract.summary && <div style={{marginBottom:foundRows.length?10:0}}>{extract.summary}</div>}
                {foundRows.length>0 &&
                  <div style={{display:"flex", flexDirection:"column", gap:5}}>
                    {foundRows.map(([k,label,kind]) =>
                      <div key={k} style={{display:"flex", justifyContent:"space-between", gap:10, fontSize:"13px"}}>
                        <span style={{color:"var(--ink-3)"}}>{label}</span>
                        <span style={{fontWeight:600, textAlign:"right"}}>{fmtExtract(kind, extract.fields[k])}</span>
                      </div>)}
                  </div>}
                <div style={{display:"flex", gap:8, marginTop:12}}>
                  {foundRows.length>0 &&
                    <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={apply} disabled={applied}>
                      {applied ? "Applied ✓" : "Apply to "+(homeName||"home")}
                    </button>}
                  <button className="btn btn-ghost btn-sm" onClick={runExtract} disabled={reading}>
                    {reading ? <span className="spin"></span> : "Re-read"}
                  </button>
                </div>
              </div>}
            {exErr && <div className="assist-msg" style={{marginTop:8}}>{exErr}</div>}
          </div>}

        <div className="facts">
          {doc.size ? <span className="chip">{humanSize(doc.size)}</span> : null}
          {doc.createdAt ? <span className="chip">Added {fmtDate(doc.createdAt)}</span> : null}
        </div>

        <button className="btn btn-primary btn-block" onClick={save} disabled={!name.trim()}>Save changes</button>
        <button className="btn btn-danger btn-block" style={{marginTop:10}}
          onClick={()=>{ if(confirm("Delete this document? The file is removed from storage.")) onDelete(doc); }}>
          Delete document
        </button>
      </div>
    </>
  );
}

  const [expanded, setExpanded] = useState({});   // closed by default: the group list IS the index
  const [query, setQuery] = useState("");
  const [sort, setSort] = useState("date-desc");
  const toggle = (k) => setExpanded(e => ({ ...e, [k]: !e[k] }));

  const all = (store.data.documents||[]).filter(d => d.home_id === home.id);

  if(!all.length){
    return (
      <div className="empty">
        <div className="glyph">[]</div>
        <h3 className="title-sm">No documents yet</h3>
        <p>Keep everything for {home.name} in one place: the closing packet, survey, disclosures, HOA papers, warranties, and insurance. Add PDFs or photos and they sort themselves.</p>
        <button className="btn btn-primary" style={{marginTop:18}} onClick={onAdd}>
          <Icon d={ICONS.upload} size={16}/> Add documents
        </button>
      </div>
    );
  }

  const total = all.reduce((s,d)=> s + (Number(d.size)||0), 0);
  const q = query.trim().toLowerCase();
  const matched = q ? all.filter(d => (d.name||"").toLowerCase().includes(q)) : all;

  const CMP = {
    "date-desc": (a,b)=> String(b.createdAt||"").localeCompare(String(a.createdAt||"")),
    "date-asc":  (a,b)=> String(a.createdAt||"").localeCompare(String(b.createdAt||"")),
    "name-asc":  (a,b)=> String(a.name||"").localeCompare(String(b.name||""), undefined, {numeric:true}),
    "name-desc": (a,b)=> String(b.name||"").localeCompare(String(a.name||""), undefined, {numeric:true}),
    "size-desc": (a,b)=> (Number(b.size)||0)-(Number(a.size)||0),
    "size-asc":  (a,b)=> (Number(a.size)||0)-(Number(b.size)||0),
  };
  const cmp = CMP[sort] || CMP["date-desc"];

  // Group by the CURRENT category (migrating any old name), sorted per the picker.
  const groups = DOC_CATEGORIES
    .map(c => [c.k, matched.filter(d => migrateDocCat(d.category) === c.k).sort(cmp)])
    .filter(g => g[1].length);
  const shown = matched.length;

  return (
    <div>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
        <div className="log-summary">
          {q ? shown + " of " + all.length + " match" : all.length + (all.length===1?" document":" documents") + (total>0 ? " · " + humanSize(total) : "")}
        </div>
        <div style={{display:"flex", gap:12}}>
          <button className="assist-toggle" style={{marginTop:14, whiteSpace:"nowrap"}} onClick={onAdd}>+ Add</button>
          <button className="assist-toggle" style={{marginTop:14, whiteSpace:"nowrap"}} onClick={onResort}>Re-file all</button>
        </div>
      </div>

      <div className="doc-tools">
        <input className="input" value={query} onChange={e=>setQuery(e.target.value)}
          placeholder="Search documents" aria-label="Search documents" />
        <select className="select" value={sort} onChange={e=>setSort(e.target.value)} aria-label="Sort">
          <option value="date-desc">Newest</option>
          <option value="date-asc">Oldest</option>
          <option value="name-asc">Name A-Z</option>
          <option value="name-desc">Name Z-A</option>
          <option value="size-desc">Largest</option>
          <option value="size-asc">Smallest</option>
        </select>
      </div>

      {!groups.length &&
        <div className="empty" style={{padding:"40px 20px"}}>
          <p>No documents match "{query}".</p>
        </div>}

      {groups.map(g => {
        const open = q ? true : (groups.length === 1 ? true : !!expanded[g[0]]);   // search or a lone group force-expands
        return (
          <div key={g[0]}>
            <button className="doc-group" onClick={()=>toggle(g[0])} aria-expanded={open}>
              <span className="doc-group-title">{g[0]}</span>
              <span className="doc-group-count">{g[1].length}</span>
              <span className={"doc-group-chev"+(open?" open":"")}><Icon d={ICONS.chev} size={16}/></span>
            </button>
            {open &&
              <div className="list" style={{marginTop:0}}>
                {g[1].map(d => <DocRow key={d.id} d={d} onEdit={onEdit} onOpen={onOpen} onDelete={onDelete} />)}
              </div>}
          </div>
        );
      })}
    </div>
  );
}

/* ============================================================
   WEATHER (Open-Meteo, no key, CORS-friendly). Shown on a home's overview.
   Uses the property's stored coordinates when the address lookup captured them,
   otherwise geocodes the city + state. Cached per home for 30 min.
   ============================================================ */
const WX_CODES = {
  0:["Clear","☀️"], 1:["Mostly clear","🌤️"], 2:["Partly cloudy","⛅"],
  3:["Cloudy","☁️"], 45:["Fog","🌫️"], 48:["Fog","🌫️"],
  51:["Light drizzle","🌦️"], 53:["Drizzle","🌦️"], 55:["Drizzle","🌦️"],
  61:["Light rain","🌧️"], 63:["Rain","🌧️"], 65:["Heavy rain","🌧️"],
  66:["Freezing rain","🌧️"], 67:["Freezing rain","🌧️"],
  71:["Light snow","🌨️"], 73:["Snow","🌨️"], 75:["Heavy snow","❄️"], 77:["Snow","🌨️"],
  80:["Showers","🌦️"], 81:["Showers","🌧️"], 82:["Heavy showers","⛈️"],
  85:["Snow showers","🌨️"], 86:["Snow showers","❄️"],
  95:["Thunderstorm","⛈️"], 96:["Thunderstorm","⛈️"], 99:["Thunderstorm","⛈️"],
};
function wxLabel(code){ return WX_CODES[code] || ["Now","🌡️"]; }

// US state abbreviation -> full name, so a 2-letter state can be matched against
// Open-Meteo's full admin1 name ("TX" vs "Texas"). Without this, a small town
// that isn't the first geocoder result could resolve to the wrong state.
const US_STATES = {AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",
  CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",
  ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",
  ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",
  MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",
  NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",
  OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",
  TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",
  WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"District of Columbia"};

// Resolve coordinates for a home's address parts. ZIP first (unambiguous for a
// US address, and it works for small unincorporated towns the city geocoder may
// place in the wrong state), then city + state via Open-Meteo with a proper
// state-name match.
async function resolveCoords(parts){
  const zip = String(parts.zip||"").match(/^\d{5}/);
  if(zip){
    try{
      const z = await fetch("https://api.zippopotam.us/us/" + zip[0]);
      if(z.ok){
        const p = ((await z.json()).places || [])[0];
        if(p && p.latitude) return { lat: +p.latitude, lon: +p.longitude };
      }
    }catch(e){ /* fall through to city */ }
  }
  if(parts.city){
    try{
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" +
        encodeURIComponent(parts.city) + "&count=5&country=US&language=en&format=json");
      if(r.ok){
        const list = ((await r.json()) || {}).results || [];
        if(list.length){
          const full = (US_STATES[String(parts.state||"").trim().toUpperCase()] || "").toUpperCase();
          const byState = full ? list.find(x => String(x.admin1||"").toUpperCase() === full) : null;
          const pick = byState || list[0];
          return { lat: pick.latitude, lon: pick.longitude };
        }
      }
    }catch(e){ /* fall through */ }
  }
  return null;
}

function WeatherStrip({ home }){
  const [wx, setWx] = useState(null);      // null=loading | "none" | {temp,code,hi,lo}
  useEffect(() => {
    let alive = true;
    (async () => {
      const ck = "wx:" + home.id;
      const cached = lsGet(ck, null);
      if(cached && cached.at && (Date.now() - cached.at) < 30*60*1000){ setWx(cached); return; }
      try{
        let lat = home.facts && home.facts.latitude;
        let lon = home.facts && home.facts.longitude;
        if(lat==null || lon==null){
          const parts = splitAddress(home.address || "");
          if(!parts.zip && !parts.city){ if(alive) setWx("none"); return; }
          const g = await resolveCoords(parts);
          if(!g){ if(alive) setWx("none"); return; }
          lat = g.lat; lon = g.lon;
        }
        const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
          "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min" +
          "&temperature_unit=fahrenheit&timezone=auto&forecast_days=1");
        if(!r.ok) throw new Error("wx " + r.status);
        const j = await r.json();
        const cur = j.current || {}, daily = j.daily || {};
        const out = { at: Date.now(),
          temp: Math.round(cur.temperature_2m), code: cur.weather_code,
          hi: (daily.temperature_2m_max||[])[0]!=null ? Math.round(daily.temperature_2m_max[0]) : null,
          lo: (daily.temperature_2m_min||[])[0]!=null ? Math.round(daily.temperature_2m_min[0]) : null };
        if(!alive) return;
        setWx(out); lsSet(ck, out);
      }catch(e){ if(alive) setWx("none"); log("WX","fail: " + e.message); }
    })();
    return () => { alive = false; };
  }, [home.id]);

  if(!wx || wx==="none") return null;      // silent while loading or unavailable
  const [label, emoji] = wxLabel(wx.code);
  return (
    <div className="wx">
      <span className="wx-emoji">{emoji}</span>
      <div className="wx-meta">
        <div className="wx-cond">{label}</div>
        {(wx.hi!=null && wx.lo!=null) && <div className="wx-hilo">H {wx.hi}° · L {wx.lo}°</div>}
      </div>
      <div className="wx-temp">{isNaN(wx.temp) ? "" : wx.temp + "°"}</div>
    </div>
  );
}

// A compact, structured snapshot of one home for the Ask feature. Small enough
// to send with each question (document list is names + categories, not contents).
function buildHomeContext(store, home){
  const sysById = {};
  const allSys = (store.data.systems||[]).filter(s => s.home_id === home.id);
  const byId = {}; allSys.forEach(x => { byId[x.id] = x; });
  const systems = allSys
    .map(s => {
      sysById[s.id] = s.title;
      const eq = s.equipment || {};
      const age = equipmentAge(eq.manufactureDate || eq.installedDate);
      return {
        name: s.title, section: s.section || null, notes: s.notes || null,
        make: eq.make || null, model: eq.model || null, serial: eq.serial || null,
        type: eq.equipmentType || null, capacity: eq.capacity || null,
        refrigerant: eq.refrigerant || null,
        manufactured: eq.manufactureDate || null,
        age: age ? age.label : null,
        warrantyRegistration: eq.warranty || null,
        installedBy: s.installer || null,
        // Imported notes attached to this equipment: its history and context.
        relatedNotes: (s.linkedIds||[]).map(id => byId[id]).filter(Boolean)
          .map(x => ({ title: x.title, notes: x.notes || null })),
      };
    });
  const log = (store.data.events||[]).filter(e => e.home_id === home.id)
    .map(e => ({ title:e.title, category:e.category, date:e.date, cost:e.cost, vendor:e.vendor,
                 system: e.system_id ? (sysById[e.system_id] || null) : null, notes:e.notes }));
  const reminders = (store.data.reminders||[]).filter(r => r.home_id === home.id)
    .map(r => ({ title:r.title, category:r.category, dueDate:r.dueDate,
      repeat: r.repeat ? (r.every + " " + r.unit) : null, done: !!r.doneAt }));
  const documents = (store.data.documents||[]).filter(d => d.home_id === home.id)
    .map(d => ({ name:d.name, category: migrateDocCat(d.category), path: d.path || null }));
  return {
    home: { name:home.name, address:home.address, type:home.type, purchaseDate:home.purchaseDate },
    facts: home.facts || {},
    systems, log, reminders, documents,
  };
}

function AskBox({ store, home }){
  const [q, setQ] = useState("");
  const [answer, setAnswer] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const ask = async () => {
    const question = q.trim();
    if(!question || busy) return;
    setBusy(true); setErr(""); setAnswer("");
    try{
      const res = await askHome(question, buildHomeContext(store, home));
      setAnswer((res && res.answer) || "No answer.");
    }catch(e){ setErr(e.message || "Couldn't answer that."); }
    finally{ setBusy(false); }
  };
  return (
    <div className="card ask-card">
      <div className="ask-row">
        <input className="input" value={q} onChange={e=>setQ(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter") ask(); }}
          placeholder="Ask about this home…" aria-label="Ask about this home" />
        <button className="btn btn-primary btn-sm ask-go" onClick={ask} disabled={busy || !q.trim()} aria-label="Ask">
          {busy ? <span className="spin"></span> : <Icon d={ICONS.sparkle} size={16}/>}
        </button>
      </div>
      {answer && <div className="ask-answer">{answer}</div>}
      {err && <div className="assist-msg" style={{marginTop:8}}>{err}</div>}
      {!answer && !err && !busy &&
        <div className="hint" style={{marginTop:8}}>Try "When was the generator last serviced?" or "How much have I spent on repairs?"</div>}
    </div>
  );
}

/* ============================================================
   SYSTEMS & NOTES (per-home reference: equipment, systems, vendors, notes).
   Grouped by section, searchable; rows swipe to delete, tap to edit. Populated
   by the Trello import and by manual entry.
   ============================================================ */
const WARRANTY_STATES = [
  { k:"unknown",      label:"Not checked" },
  { k:"registered",   label:"Registered" },
  { k:"notRegistered",label:"Not registered" },
];

/* ============================================================
   JOBS - one problem from symptom to resolution. A broken system is a story,
   not a row: the diagnostic, the home-warranty claim, the second opinion and
   the eventual fix all belong to the same thing. Money still lives in `events`
   (each visit is a normal Log entry carrying job_id), so spend and history are
   never split across two sources of truth.
   ============================================================ */
const JOB_STATES = [
  { k:"open",      label:"Open",             done:false },
  { k:"diagnosed", label:"Diagnosed",        done:false },
  { k:"coverage",  label:"Awaiting coverage",done:false },
  { k:"quoted",    label:"Quoted",           done:false },
  { k:"scheduled", label:"Scheduled",        done:false },
  { k:"resolved",  label:"Resolved",         done:true  },
];
function jobState(k){ return JOB_STATES.find(s => s.k === k) || JOB_STATES[0]; }
function isJobOpen(j){ return !jobState(j.status).done; }
const POLICY_KINDS = ["Home warranty", "Homeowners insurance", "Service plan", "Other"];
// Status is the stage an issue has REACHED. What it is stuck on is a separate
// question, and there is usually more than one answer at once: a diagnosis in
// hand, a warranty claim open, and a second opinion still coming.
const WAITING_ON = [
  { k:"coverage",  label:"Coverage decision" },
  { k:"opinion",   label:"Second opinion" },
  { k:"quote",     label:"Quote" },
  { k:"parts",     label:"Parts" },
  { k:"schedule",  label:"Scheduling" },
  { k:"decision",  label:"My decision" },
];
function waitingLabels(j){
  return ((j && j.waitingOn) || []).map(k => (WAITING_ON.find(w => w.k === k) || {}).label).filter(Boolean);
}
