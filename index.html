function SystemRow({ s, jobs, onEdit, onDelete }){
  const eq = s.equipment || {};
  const age = equipmentAge(eq.manufactureDate || eq.installedDate);
  const spec = [eq.make, eq.model].filter(Boolean).join(" ");
  return (
    <SwipeRow onDelete={()=>onDelete(s)}>
      <div className="item">
        {((s.photos||[])[0] || s.photo)
          ? <SysThumb path={(s.photos||[])[0] || s.photo} />
          : <span className="sys-ic"><Icon d={systemIcon(s)} size={17}/></span>}
        <button className="rem-body" onClick={()=>onEdit(s)}>
          <div className="item-title">{s.title}</div>
          {spec ? <div style={{fontSize:12.5, color:"var(--ink-3)", marginTop:3}}>{spec}</div>
                : (s.notes ? <div style={{fontSize:13, color:"var(--ink-3)", marginTop:3, display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical", overflow:"hidden"}}>{s.notes}</div> : null)}
          {/* !! matters: an empty attachments array makes this expression 0,
              and React renders a literal 0 under the row. */}
          {!!(age || s.trade || s.phone || jobs > 0 || (s.linkedIds||[]).length || (s.attachments||[]).length) &&
            <div className="item-meta">
              {age && <span className="chip amber">{age.label}</span>}
              {s.trade && <span className="chip amber">{s.trade}</span>}
              {s.phone && <span className="chip">{s.phone}</span>}
              {jobs > 0 && <span className="chip">{jobs} service {jobs===1?"visit":"visits"}</span>}
              {(s.linkedIds && s.linkedIds.length) ? <span className="chip">{s.linkedIds.length} linked note{s.linkedIds.length===1?"":"s"}</span> : null}
              {(s.attachments && s.attachments.length) ?
                <span className="chip">{s.attachments.length} file{s.attachments.length===1?"":"s"} on Trello</span> : null}
            </div>}
        </button>
        <button className="rem-done" onClick={()=>onEdit(s)} aria-label="Edit">
          <Icon d={ICONS.edit} size={16}/>
        </button>
      </div>
    </SwipeRow>
  );
}

/* Redundant entries: the same thing written twice, e.g. "Propane System
   (Buried Tank)" and "Buried propane tank". Compare the SIGNIFICANT words
   rather than the string, ignoring filler and punctuation, so a rewording and
   a hyphen do not hide a duplicate. Detection only - what happens to them is
   the owner's call. */
const DUP_STOP = new Set(["the","a","an","and","or","of","for","to","in","on","with","my","our",
  "system","systems","unit","units","reference","details","detail","info","information",
  "note","notes","misc","general","overview"]);
  // NOTE: "main", "house", "master", "new", "old" are deliberately NOT filler.
  // "Main House HVAC" and "Master House HVAC" are two different machines.
function dupTokens(t){
  return String(t||"").toLowerCase().replace(/[^a-z0-9]+/g, " ").split(/\s+/)
    // keep lone digits: the "1" in "Water Heater #1" is the whole distinction
    .filter(w => w && (w.length > 1 || /^\d$/.test(w)) && !DUP_STOP.has(w));
}
function dupNums(t){
  return (String(t||"").match(/\d+/g) || []).join(",");
}
function dupKey(t){
  // letters and digits only, sorted: blind to word order, hyphens and spacing,
  // so "Kitchen Jenn-Air Appliances" and "jennair kitchen appliances" agree
  return dupTokens(t).join("").split("").sort().join("");
}
function dupSimilar(a, b){
  const A = new Set(dupTokens(a)), B = new Set(dupTokens(b));
  if(!A.size || !B.size) return 0;
  let shared = 0;
  A.forEach(w => { if(B.has(w)) shared++; });
  return shared / new Set([...A, ...B]).size;          // Jaccard
}
function dupSameThing(a, b){
  // Different numbers mean different things: heater #1 is not heater #2,
  // and zone 1 is not zone 2, however alike the rest of the name reads.
  const na = dupNums(a), nb = dupNums(b);
  if(na && nb && na !== nb) return false;
  return dupKey(a) === dupKey(b) || dupSimilar(a, b) >= 0.6;
}
// Group entries that look like the same thing. Returns arrays of 2+ ids.
function findDuplicates(entries){
  const list = entries || [];
  const used = new Set(), groups = [];
  for(let i = 0; i < list.length; i++){
    if(used.has(list[i].id)) continue;
    const group = [list[i]];
    for(let j = i + 1; j < list.length; j++){
      if(used.has(list[j].id)) continue;
      if(dupSameThing(list[i].title, list[j].title)){
        group.push(list[j]);
        used.add(list[j].id);
      }
    }
    if(group.length > 1){ used.add(list[i].id); groups.push(group.map(x => x.id)); }
  }
  return groups;
}

const KIND_META = {
  equipment: { label:"Equipment",        hint:"things in the house" },
  vendor:    { label:"Vendors & people", hint:"who services it" },
  note:      { label:"Reference notes",  hint:"everything else" },
};
const KIND_ORDER = ["equipment", "vendor", "note"];

/* Review the tidy-up before it happens. Every row carries a recommended name
   you can edit in place and a category you can change, so accepting is one tap
   and disagreeing is one edit. Accept all is right there for anyone who would
   rather fix things later in the list. */
function OrganizeSheet({ review, onApply, onClose }){
  const rows = review.rows || [];
  const [edits, setEdits] = useState({});                       // id -> edited title
  const [kinds, setKinds] = useState({});                       // id -> overridden kind
  const [sel, setSel] = useState(() => rows.filter(r => r.changed).map(r => r.id));
  // Duplicates arrive with a recommendation already made: keep the richest of
  // each group, delete the rest. The keeper is protected, so a group can never
  // be emptied by accident.
  const dupKeep = review.dupKeep || {};
  const keepers = new Set(Object.values(dupKeep));
  const [del, setDel] = useState(() =>
    (review.dupGroups || []).flat().filter(id => !keepers.has(id)));
  const toggle = (id) => setSel(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const toggleDel = (id) => setDel(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

  const titleOf = (r) => (edits[r.id] !== undefined ? edits[r.id] : r.title);
  const kindOfRow = (r) => kinds[r.id] || r.kind;
  const dupGroups = review.dupGroups || [];
  const dupOf = {};
  dupGroups.forEach((g, i) => g.forEach(id => { dupOf[id] = i + 1; }));

  const chosen = rows.filter(r => sel.includes(r.id) && !del.includes(r.id))
    .map(r => ({ ...r, title: titleOf(r).trim() || r.title, kind: kindOfRow(r) }));
  const changed = rows.filter(r => r.changed);
  // Accept all means accept the whole recommendation, deletions included.
  const acceptAll = () => {
    setSel(rows.map(r => r.id)); setEdits({}); setKinds({});
    setDel((review.dupGroups || []).flat().filter(id => !keepers.has(id)));
  };

  const KINDS = [["equipment","System"],["vendor","Vendor"],["note","Note"]];

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">Organize</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>

        <div className="hint" style={{marginBottom:8}}>
          {rows.length} entries
          {review.localCount != null ? ` · ${review.localCount} sorted on the spot, ${review.aiCount} needed a closer look` : ""}.
          Edit any name or category here, or accept everything and tidy up later. Nothing is merged.
        </div>
        {dupGroups.length > 0 &&
          <div className="hint" style={{color:"var(--amber)", marginBottom:8}}>
            {dupGroups.length} possible duplicate {dupGroups.length===1?"group":"groups"}. The fullest entry in each is
            marked <b>keep</b> and the copies are already marked for deletion &mdash; tap a bin to change your mind.
            One of each group is always kept.
          </div>}
        <div className="hint" style={{marginBottom:8}}>
          Tick to accept a recommendation. Bin deletes the entry entirely.
        </div>

        <div style={{display:"flex", gap:12, marginBottom:8, flexWrap:"wrap"}}>
          <button className="assist-toggle" onClick={acceptAll}>Accept all</button>
          <button className="assist-toggle" onClick={()=>setSel(changed.map(r=>r.id))}>Only changes</button>
          <button className="assist-toggle" onClick={()=>{ setSel([]); setDel([]); }}>None</button>
        </div>

        <div className="list" style={{maxHeight:"44vh", overflowY:"auto", marginTop:0}}>
          {KIND_ORDER.map(k => {
            const inKind = rows.filter(r => kindOfRow(r) === k);
            if(!inKind.length) return null;
            return (
              <div key={k}>
                <div className="doc-group" style={{cursor:"default"}}>
                  <span className="doc-group-title">{KIND_META[k].label}</span>
                  <span className="doc-group-count">{inKind.length}</span>
                  <span style={{fontSize:11.5, color:"var(--ink-3)", marginLeft:8}}>{KIND_META[k].hint}</span>
                </div>
                {inKind.map(r => {
                  const on = sel.includes(r.id);
                  const gone = del.includes(r.id);
                  return (
                    <div key={r.id} className={"item"+(on && !gone ? "" : " muted")} style={{alignItems:"flex-start"}}>
                      <button className="rem-done" style={{marginTop:2, ...(on && !gone ? {background:"var(--amber-dim)",color:"var(--amber)",borderColor:"var(--amber-line)"} : {})}}
                        onClick={()=>toggle(r.id)} aria-label={on ? "Skip this one" : "Accept this one"}>
                        <Icon d={on && !gone ? ICONS.check : ICONS.plus} size={15}/>
                      </button>
                      <div className="item-body">
                        <input className="input" style={{marginBottom:6, textDecoration: gone ? "line-through" : "none"}}
                          value={titleOf(r)} disabled={gone}
                          onChange={e=>setEdits(p => ({ ...p, [r.id]: e.target.value }))} />
                        {titleOf(r) !== r.was &&
                          <div style={{fontSize:11.5, color:"var(--ink-3)", marginBottom:5}}>was &ldquo;{r.was}&rdquo;</div>}
                        <div className="pills" style={{marginBottom:5}}>
                          {KINDS.map(([k2,label]) =>
                            <button key={k2} className={"pill "+(kindOfRow(r)===k2?"on":"")}
                              onClick={()=>setKinds(p => ({ ...p, [r.id]: k2 }))}>{label}</button>)}
                        </div>
                        <div className="item-meta">
                          {r.section && <span className="chip">{r.section}</span>}
                          {r.trade && <span className="chip amber">{r.trade}</span>}
                          {r.phone && <span className="chip">{r.phone}</span>}
                          {dupOf[r.id] && <span className={"chip "+(keepers.has(r.id)?"green":"red")}>
                            duplicate {dupOf[r.id]}{keepers.has(r.id) ? " · keeping" : ""}</span>}
                          {r.needsSplit && <span className="chip red">two records?</span>}
                          {r.confidence === "ai" ? <span className="chip">asked AI</span>
                            : r.confidence === "high" ? <span className="chip green">certain</span>
                            : r.confidence === "medium" ? <span className="chip">likely</span> : null}
                        </div>
                        {r.why && <div style={{fontSize:11.5, color:"var(--ink-3)", marginTop:3}}>{r.why}</div>}
                      </div>
                      {keepers.has(r.id)
                        ? <span className="chip green" style={{marginTop:4, alignSelf:"flex-start"}}>keep</span>
                        : <button className="rem-done" style={{marginTop:2, ...(gone ? {background:"#d1735c22",color:"#e79b86",borderColor:"#d1735c55"} : {})}}
                            onClick={()=>toggleDel(r.id)} aria-label={gone ? "Keep this entry" : "Delete this entry"}>
                            <Icon d={gone ? ICONS.undo : ICONS.trash} size={15}/>
                          </button>}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>

        <button className="btn btn-primary btn-block" style={{marginTop:12}} disabled={!chosen.length && !del.length}
          onClick={()=>onApply(chosen, del)}>
          {del.length
            ? `Apply ${chosen.length}, delete ${del.length}`
            : `Apply ${chosen.length} ${chosen.length===1?"change":"changes"}`}
        </button>
      </div>
    </>
  );
}

// Equipment, the people who service it, and everything else are three different
// things that happened to arrive in one Trello bucket. One component, three
// views: an entry with no kind yet counts as unsorted and stays with Systems,
// so nothing disappears before the tidy-up has been run.
/* ============================================================
   ENTRY CLASSIFIER - local, deterministic, no network.

   Field PRESENCE is a stronger signal than vocabulary. A phone number and a
   street address mean a person you call; a model number and a capacity mean a
   machine. That distinction is what stops the trade-name collision: a company
   called "JB Aire HVAC Service Provider" is full of system vocabulary and is
   still obviously a vendor, because it has a phone number and no model number.

   So bare trade words (hvac, plumbing, electric) score NOTHING on their own.
   Only concrete equipment evidence counts as equipment.

   Returns { kind, confidence, why }. kind may be "mixed", meaning both sides
   scored and the record probably wants splitting - which is a question for the
   owner, not something to silently pick a side on.
   ============================================================ */
const RX_PHONE   = /(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b/;
const RX_ADDRESS = /\d{2,6}\s+[A-Za-z][A-Za-z.'-]*(\s+[A-Za-z.'-]+)*\s+(rd|road|st|street|ave|avenue|dr|drive|ln|lane|blvd|boulevard|hwy|highway|way|ct|court|pkwy|trail|tr)\b/i;
const RX_EMAIL   = /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;
const RX_SERIAL  = /\b(serial|s\/n|ser#)\b|\b[A-Z0-9]{4,}[0-9]{3,}[A-Z0-9]*\b/;
const RX_MODEL    = /\b(model|mfg|part)\s*(no\.?|number|#|:)/i;
const RX_CAPACITY = /\b\d+(\.\d+)?\s?(ton|tons|btu|kw|kva|gal|gallon|seer|amp|volts?)\b/i;
const RX_INSTALL  = /\b(installed|install date|manufactured|date of manufacture|in service|replaced in)\b/i;
const RX_INTERVAL = /\b(every|annually|quarterly|monthly|semi.?annual|each (spring|fall|year|month))\b/i;
const RX_MAKE     = /\b(carrier|trane|lennox|rheem|goodman|bryant|generac|kohler|pentair|hayward|jandy|jenn.?air|sub.?zero|kitchenaid|bosch|rinnai|navien|aosmith|a\.o\. smith|rainbird|hunter|ruud|amana|daikin|mitsubishi)\b/i;
const RX_COMPANY  = /\b(inc\.?|llc|l\.l\.c\.|co\.|corp\.?|company|services?|service provider|contractors?|contracting|plumbing co|& sons|group|specialists?)\b/i;
const RX_PERSON   = /\b(contact|call|ask for|owner|technician|tech\b|rep\b|foreman|person for|guy for|handyman)\b/i;
const RX_NOTEISH  = /\b(checklist|locations?|overview|quick reference|summary|planning|to.?do|shutoffs?|where to find|list of)\b/i;

function classifyEntry(e){
  const title = String((e && e.title) || "");
  const notes = String((e && e.notes) || "");
  const text  = title + " \n " + notes;
  const eq    = (e && e.equipment) || {};
  let vendor = 0, system = 0;
  const why = [];

  // --- vendor evidence: someone you contact
  if(RX_PHONE.test(text))    { vendor += 3; why.push("phone number"); }
  if(RX_ADDRESS.test(text))  { vendor += 2; why.push("street address"); }
  if(RX_EMAIL.test(text))    { vendor += 1; why.push("email"); }
  if(RX_COMPANY.test(title)) { vendor += 2; why.push("company name"); }
  if(RX_PERSON.test(text))   { vendor += 1; why.push("a person to call"); }

  // --- equipment evidence: a machine with an identity
  if(eq.model || eq.serial || eq.make) { system += 4; why.push("nameplate on file"); }
  if(RX_SERIAL.test(text))   { system += 3; why.push("serial number"); }
  if(RX_MODEL.test(text))    { system += 3; why.push("model number"); }
  if(RX_MAKE.test(text))     { system += 2; why.push("equipment make"); }
  if(RX_CAPACITY.test(text)) { system += 2; why.push("rated capacity"); }
  if(RX_INSTALL.test(text))  { system += 2; why.push("install date"); }
  if(RX_INTERVAL.test(text)) { system += 1; why.push("service interval"); }

  const strong = 3;                       // enough evidence to stand on its own
  if(vendor >= strong && system >= strong)
    return { kind:"mixed", confidence:"low",
             why:"has both a contact and equipment details - probably two records" };

  const margin = Math.abs(vendor - system);
  const conf = margin >= 3 ? "high" : margin >= 1 ? "medium" : "low";

  if(vendor > system) return { kind:"vendor", confidence:conf, why: why.join(", ") };
  if(system > vendor) return { kind:"equipment", confidence:conf, why: why.join(", ") };

  // Nothing structured on either side. Prose that reads like reference is a
  // note; anything else is too weak to call and goes to the model.
  if(RX_NOTEISH.test(title)) return { kind:"note", confidence:"medium", why:"reads as reference" };
  return { kind:"note", confidence:"low", why:"nothing decisive" };
}

const KIND_VIEWS = {
  systems: { kinds:["equipment","unsorted"], glyph:"{}",
             empty:"No systems yet",
             body:"The physical things: HVAC, water heaters, roof, generator, pool equipment, appliances. Scan a rating plate and the model, serial and age fill themselves in." },
  vendors: { kinds:["vendor"], glyph:"@",
             empty:"No vendors yet",
             body:"The people who look after the place: who you call, what they do, and what they have done here before." },
  notes:   { kinds:["note"], glyph:"*",
             empty:"No notes yet",
             body:"Everything that is neither a machine nor a person: shutoff locations, warranties, checklists, anything worth remembering." },
};
function kindOf(x){ return x.kind || "unsorted"; }

function SystemsScreen({ store, home, view, onAdd, onEdit, onDelete, onImportTrello, onOrganize }){
  const [expanded, setExpanded] = useState({});   // closed by default, same as Docs
  const [query, setQuery] = useState("");
  const toggle = (k) => setExpanded(e => ({ ...e, [k]: !e[k] }));

  const cfg = KIND_VIEWS[view] || KIND_VIEWS.systems;
  const mine = (store.data.systems||[]).filter(s => s.home_id === home.id);
  const all = mine.filter(s => cfg.kinds.includes(kindOf(s)));
  const unsorted = mine.filter(s => kindOf(s) === "unsorted").length;
  // How many logged visits each system has, so a row can say "3 service visits".
  const jobCount = {};
  (store.data.events||[]).forEach(e => {
    if(e.home_id === home.id && e.system_id) jobCount[e.system_id] = (jobCount[e.system_id]||0) + 1;
  });

  if(!all.length){
    return (
      <div className="empty">
        <div className="glyph">{cfg.glyph}</div>
        <h3 className="title-sm">{cfg.empty}</h3>
        <p>{cfg.body}</p>
        {mine.length > 0 &&
          <button className="btn btn-ghost" style={{marginTop:14}} onClick={onOrganize}>
            <Icon d={ICONS.sparkle} size={16}/> Sort my {mine.length} entries
          </button>}
        <button className="btn btn-primary" style={{marginTop:18}} onClick={onAdd}>
          <Icon d={ICONS.plus} size={16}/> Add one
        </button>
        <button className="btn btn-ghost" style={{marginTop:10}} onClick={onImportTrello}>
          <Icon d={ICONS.upload} size={16}/> Import a Trello board
        </button>
      </div>
    );
  }

  const q = query.trim().toLowerCase();
  const matched = q ? all.filter(s =>
    (s.title||"").toLowerCase().includes(q) || (s.notes||"").toLowerCase().includes(q) || (s.section||"").toLowerCase().includes(q)) : all;

  // Once entries carry a kind (after Organize), group by what things ARE:
  // equipment, the people who service it, then everything else. Until then,
  // fall back to the section they were imported under.
  const byTitle = (a,b) => String(a.title||"").localeCompare(String(b.title||""), undefined, {numeric:true});
  const sections = [];
  matched.forEach(s => { const k = s.section || "General"; if(!sections.includes(k)) sections.push(k); });
  sections.sort((a,b) => a==="General" ? 1 : b==="General" ? -1 : a.localeCompare(b));
  const groups = sections.map(k => [k, matched.filter(s => (s.section||"General") === k).sort(byTitle)]);

  return (
    <div>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
        <div className="log-summary">
          {q ? matched.length + " of " + all.length + " match" : all.length + (all.length===1?" entry":" entries")}
        </div>
        <div style={{display:"flex", gap:12}}>
          <button className="assist-toggle" style={{marginTop:14, whiteSpace:"nowrap"}} onClick={onOrganize}>Organize</button>
          <button className="assist-toggle" style={{marginTop:14, whiteSpace:"nowrap"}} onClick={onAdd}>+ Add</button>
        </div>
      </div>

      {unsorted > 0 &&
        <div className="hint" style={{color:"var(--amber)", marginBottom:4}}>
          {unsorted} {unsorted===1?"entry has":"entries have"} not been sorted into systems, vendors and notes yet. Tap Organize.
        </div>}

      <div className="doc-tools">
        <input className="input" value={query} onChange={e=>setQuery(e.target.value)}
          placeholder="Search" aria-label="Search" />
      </div>

      {!groups.length &&
        <div className="empty" style={{padding:"40px 20px"}}><p>Nothing matches "{query}".</p></div>}

      {groups.map(g => {
        const open = q ? true : (groups.length === 1 ? true : !!expanded[g[0]]);
        return (
          <div key={g[0]}>
            <button className="doc-group" onClick={()=>toggle(g[0])} aria-expanded={open}>
              <span className="doc-group-title">{g[0]}</span>
              <span className="doc-group-count">{g[1].length}</span>
              <span className={"doc-group-chev"+(open?" open":"")}><Icon d={ICONS.chev} size={16}/></span>
            </button>
            {open &&
              <div className="list" style={{marginTop:0}}>
                {g[1].map(s => <SystemRow key={s.id} s={s} jobs={jobCount[s.id]||0} onEdit={onEdit} onDelete={onDelete} />)}
              </div>}
          </div>
        );
      })}
    </div>
  );
}

function SystemSheet({ system, homeId, presetKind, history, siblings, onEditEntry, onSave, onDelete, onClose }){
  const s = system || {};
  const [title, setTitle] = useState(s.title || "");
  const [section, setSection] = useState(s.section || "");
  const [notes, setNotes] = useState(s.notes || "");
  const [eq, setEq] = useState(s.equipment || {});     // nameplate facts
  const [installer, setInstaller] = useState(s.installer || "");
  // Imported Trello cards are this equipment's history. Rather than fold them
  // into one blob, keep them as their own notes and hang them off the record.
  const [kind, setKind] = useState(s.kind || presetKind || "");
  const [linkedIds, setLinkedIds] = useState(s.linkedIds || []);
  const [linking, setLinking] = useState(false);
  const [linkQ, setLinkQ] = useState("");
  const MAX_PHOTOS = 4;
  // Seeded from the older single-photo field so nothing already saved is lost.
  const [photos, setPhotos] = useState(() => s.photos || (s.photo ? [s.photo] : []));
  const [scanning, setScanning] = useState("");
  const [err, setErr] = useState("");
  const setField = (k, v) => setEq(p => ({ ...p, [k]: v }));

  // A picture of the unit itself, distinct from the rating plate: it is what
  // makes the list readable at a glance, and what you show a contractor.
  const onPhoto = async (fileList) => {
    const files = Array.from(fileList || []).slice(0, MAX_PHOTOS - photos.length);
    if(!files.length) return;
    setErr("");
    const added = [];
    for(let i = 0; i < files.length; i++){
      setScanning("Adding photo " + (i + 1) + " of " + files.length + "…");
      try{
        const b64 = await resizeImage(files[i]);
        const path = "systems/" + (s.id || "new") + "/photo-" + Date.now().toString(36) + "-" + i + ".jpg";
        await uploadFile(path, b64);
        added.push(path);
      }catch(e){ setErr(e.message || "Couldn't add that photo."); }
    }
    if(added.length) setPhotos(p => [...p, ...added].slice(0, MAX_PHOTOS));
    setScanning("");
  };
  const removePhoto = (path) => { deleteFile(path); setPhotos(p => p.filter(x => x !== path)); };

  // Photograph the rating plate -> upload -> AI transcribes -> fill the fields.
  const onPlate = async (file) => {
    if(!file) return;
    setErr(""); setScanning("Reading the plate…");
    try{
      const b64 = await resizeImage(file);
      const path = "systems/" + (s.id || "new") + "/plate-" + Date.now().toString(36) + ".jpg";
      await uploadFile(path, b64);
      const res = await readNameplate(path);
      const f = (res && res.fields) || {};
      if(!Object.keys(f).length){ setErr("Couldn't read that plate. Try a straight-on, well-lit shot."); }
      else setEq(p => ({ ...p, ...f, platePath: path }));
      setScanning("");
    }catch(e){ setScanning(""); setErr(e.message || "Couldn't read that plate."); }
  };

  const save = () => {
    const t = title.trim();
    if(!t) return;
    const now = nowISO();
    const clean = {};
    Object.keys(eq).forEach(k => { const v = String(eq[k]||"").trim(); if(v) clean[k] = v; });
    onSave({
      ...s,
      id: s.id || uid(), home_id: s.home_id || homeId,
      title: t, section: section.trim(), notes: notes.trim(),
      kind: kind || (classifyEntry({ title, notes, equipment: eq }).kind === 'mixed'
        ? 'equipment' : classifyEntry({ title, notes, equipment: eq }).kind),
      equipment: Object.keys(clean).length ? clean : null,
      installer: installer.trim(),
      photos: photos.length ? photos : null,
      photo: photos[0] || null,   // first one, so the list thumbnail keeps working
      linkedIds: linkedIds.length ? linkedIds : null,
      attachments: s.attachments || [],
      source: s.source || "manual",
      createdAt: s.createdAt || now, updatedAt: now,
    });
  };

  const age = equipmentAge(eq.manufactureDate || eq.installedDate);
  const EQ_ROWS = [
    ["make","Make","Carrier"], ["model","Model","25VNA860A300"], ["serial","Serial","4217E00464"],
    ["manufactureDate","Made (YYYY-MM)","2017-10"], ["equipmentType","Type","Heat pump"],
    ["capacity","Capacity","60,000 BTU"], ["refrigerant","Refrigerant","R-410A"],
  ];

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">{system ? "Edit" : "Add a system or note"}</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>
        <label className="field-label">Title</label>
        <input className="input" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. HVAC - north side, Main House" />
        <label className="field-label">Section</label>
        <input className="input" value={section} onChange={e=>setSection(e.target.value)} placeholder="e.g. HVAC Systems" />

        {/* Classify at capture, not in a batch later: show what this looks like
            and let it be corrected in one tap. Never assigned silently. */}
        {(() => {
          const guess = classifyEntry({ title, notes, equipment: eq });
          const current = kind || (guess.kind === "mixed" ? "equipment" : guess.kind);
          const opts = [["equipment","System"],["vendor","Vendor"],["note","Note"]];
          return (
            <>
              <div className="field-label" style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
                <span>This is a</span>
                {!kind && title.trim() && guess.why &&
                  <span style={{fontSize:11, color:"var(--ink-3)", fontWeight:400, textTransform:"none", letterSpacing:0}}>
                    {guess.kind === "mixed" ? "looks like two records" : "guessed: " + guess.why}
                  </span>}
              </div>
              <div className="pills">
                {opts.map(([k,label]) =>
                  <button key={k} className={"pill "+(current===k?"on":"")} onClick={()=>setKind(k)}>{label}</button>)}
              </div>
            </>
          );
        })()}

        <div className="field-label" style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
          <span>Equipment</span>
          {age && <span className="chip amber">{age.label}</span>}
        </div>
        <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:10}}>
          <span className="sys-ic" style={{width:52, height:52, borderRadius:11}}>
            <Icon d={systemIcon({ title, section, equipment: eq })} size={22}/>
          </span>
          <div style={{flex:1}}>
            <div style={{fontSize:13, color:"var(--ink-3)"}}>
              {photos.length ? photos.length + " of " + MAX_PHOTOS + " photos" : "No photos yet"}
            </div>
          </div>
        </div>
        {/* No capture attribute: that forces the camera and hides the library.
            Multiple, so several can come from the roll in one go. */}
        <div className="photos-grid">
          {photos.map(ph => <StoredImg key={ph} path={ph} onRemove={()=>removePhoto(ph)} />)}
          {photos.length < MAX_PHOTOS &&
            <label className="add-photo" style={{cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center"}}>
              <Icon d={ICONS.camera} size={18}/>
              <input type="file" accept="image/*" multiple style={{display:"none"}}
                onChange={e=>{ const f=e.target.files; e.target.value=""; onPhoto(f); }} />
            </label>}
        </div>
        <div className="hint">Take a photo or pick from your library. Up to {MAX_PHOTOS}.</div>
        <label className="btn btn-ghost btn-block" style={{cursor:"pointer", marginTop:8}}>
          <Icon d={ICONS.camera} size={16}/> {eq.model ? "Re-scan the rating plate" : "Scan the rating plate"}
          <input type="file" accept="image/*" style={{display:"none"}}
            onChange={e=>{ const f=(e.target.files||[])[0]; e.target.value=""; onPlate(f); }} />
        </label>
        <div className="hint">Photograph the metal data plate on the unit. The model, serial, and date of manufacture fill themselves in.</div>
        {scanning && <div className="hint" style={{color:"var(--amber)"}}>{scanning}</div>}
        {err && <div className="hint" style={{color:"#e08a7a"}}>{err}</div>}

        {EQ_ROWS.map(([k,label,ph]) => (
          <div key={k}>
            <label className="field-label">{label}</label>
            <input className="input" value={eq[k]||""} onChange={e=>setField(k, e.target.value)} placeholder={ph} />
          </div>
        ))}
        <label className="field-label">Installed by</label>
        <input className="input" value={installer} onChange={e=>setInstaller(e.target.value)} placeholder="e.g. Schmidt Mechanical Group" />

        {/* Warranty registration is the single fact that decides whether parts are
            covered, and it is knowable once and never again. Record the answer so
            the app stops asking and starts telling. */}
        <label className="field-label">Warranty registration</label>
        <div className="pills">
          {WARRANTY_STATES.map(w =>
            <button key={w.k} className={"pill "+(( eq.warranty||"unknown")===w.k?"on":"")}
              onClick={()=>setField("warranty", w.k)}>{w.label}</button>)}
        </div>
        {(() => {
          const st = eq.warranty || "unknown";
          if(st === "unknown" && age && age.years >= 4) return (
            <div className="hint">
              Parts warranties commonly run 5 years, or 10 if the unit was registered after installation.
              At {age.label.replace(" old","")} that difference decides who pays. Ask before approving parts.
            </div>);
          if(st === "registered") return (
            <div className="hint" style={{color:"var(--amber)"}}>
              Registered, so the extended parts term (commonly 10 years) should apply.
              {age ? " This unit is " + age.label.replace(" old","") + "." : ""} Have the contractor bill parts to the manufacturer.
            </div>);
          if(st === "notRegistered") return (
            <div className="hint" style={{color:"#e08a7a"}}>
              Not registered, so only the base parts term (commonly 5 years) ever applied
              {age && age.years >= 5 ? " and this unit is " + age.label.replace(" old","") + ", so parts are out of pocket." : "."}
              {" "}Get the repair quote in writing and price a replacement alongside it before deciding.
            </div>);
          return null;
        })()}

        <label className="field-label">Details</label>
        <textarea className="input" style={{minHeight:90, resize:"vertical"}} value={notes} onChange={e=>setNotes(e.target.value)}
          placeholder="Anything else worth remembering about this system." />

        {/* Related notes: the imported context that explains this equipment. */}
        {(() => {
          const pool = (siblings||[]).filter(x => x.id !== (s.id||""));
          const linked = pool.filter(x => linkedIds.includes(x.id));
          const words = String(title||"").toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2);
          const score = (x) => {
            const hay = ((x.title||"") + " " + (x.section||"")).toLowerCase();
            return words.reduce((n,w) => n + (hay.includes(w) ? 1 : 0), 0);
          };
          const q = linkQ.trim().toLowerCase();
          const avail = pool.filter(x => !linkedIds.includes(x.id))
            .filter(x => !q || ((x.title||"")+" "+(x.section||"")+" "+(x.notes||"")).toLowerCase().includes(q))
            .sort((a,b) => score(b) - score(a) || String(a.title||"").localeCompare(String(b.title||"")));
          return (
            <>
              <div className="field-label" style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
                <span>Related notes{linked.length ? " ("+linked.length+")" : ""}</span>
                {!linking && pool.length > 0 &&
                  <button className="assist-toggle" style={{marginTop:0}} onClick={()=>{ setLinking(true); setLinkQ(""); }}>Attach</button>}
              </div>
              {linked.length > 0 &&
                <div className="list" style={{marginTop:0}}>
                  {linked.map(x => (
                    <div key={x.id} className="item">
                      <div className="item-body">
                        <div className="item-title">{x.title}</div>
                        {x.notes ? <div style={{fontSize:12.5, color:"var(--ink-3)", marginTop:3, display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical", overflow:"hidden"}}>{x.notes}</div> : null}
                      </div>
                      <button className="rem-done" onClick={()=>setLinkedIds(ids => ids.filter(i => i !== x.id))} aria-label="Detach">
                        <Icon d={ICONS.x} size={15}/>
                      </button>
                    </div>
                  ))}
                </div>}
              {!linked.length && !linking &&
                <div className="hint">Attach the imported notes that describe this equipment, and its history travels with it.</div>}
              {linking &&
                <>
                  <input className="input" value={linkQ} onChange={e=>setLinkQ(e.target.value)} autoFocus
                    placeholder="Search notes to attach" aria-label="Search notes" />
                  <div className="list" style={{marginTop:6, maxHeight:"26vh", overflowY:"auto"}}>
                    {avail.map(x => (
                      <button key={x.id} className="item" onClick={()=>{ setLinkedIds(ids => [...ids, x.id]); setLinking(false); }}>
                        <div className="item-body">
                          <div className="item-title">{x.title}</div>
                          <div className="item-meta">
                            {score(x) > 0 && <span className="chip amber">likely match</span>}
                            {x.section && <span className="chip">{x.section}</span>}
                          </div>
                        </div>
                      </button>
                    ))}
                    {!avail.length && <div className="empty" style={{padding:"22px 16px"}}><p>Nothing left to attach.</p></div>}
                  </div>
                  <button className="assist-toggle" style={{marginTop:6}} onClick={()=>setLinking(false)}>Done</button>
                </>}
            </>
          );
        })()}

        {history && history.length > 0 &&
          <>
            <div className="field-label">Service history ({history.length})</div>
            <div className="list" style={{marginTop:0, maxHeight:"22vh", overflowY:"auto"}}>
              {history.map(e => (
                <button key={e.id} className="item" onClick={()=>onEditEntry && onEditEntry(e)}>
                  <div className="item-body">
                    <div className="item-title">{e.title}</div>
                    <div className="item-meta">
                      {e.date ? <span className="chip">{fmtDate(e.date)}</span> : <span className="chip">No date</span>}
                      {e.cost!=null && e.cost!=="" && <span className="chip">${fmtNum(e.cost)}</span>}
                      {e.vendor && <span className="chip">{e.vendor}</span>}
                      {e.receipt && <span className="chip">invoice</span>}
                    </div>
                  </div>
                  <span className="hub-card-chev"><Icon d={ICONS.chev} size={16}/></span>
                </button>
              ))}
            </div>
          </>}

        <button className="btn btn-primary btn-block" style={{marginTop:14}} disabled={!title.trim()} onClick={save}>
          {system ? "Save changes" : "Add it"}
        </button>
        {system &&
          <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>onDelete(system)}>
            <Icon d={ICONS.trash} size={15}/> Delete
          </button>}
      </div>
    </>
  );
}

/* ============================================================
   COVERAGE (home warranty / insurance policies on a property)
   ============================================================ */
function PolicySheet({ policy, homeId, prefill, sourceDoc, onSave, onDelete, onClose }){
  // A brand-new policy can arrive pre-read from a document; an existing one
  // always wins over a prefill so editing never gets overwritten by a re-read.
  const p = policy || prefill || {};
  const [provider, setProvider] = useState(p.provider || "");
  const [kind, setKind] = useState(POLICY_KINDS.indexOf(p.kind) >= 0 ? p.kind : POLICY_KINDS[0]);
  const [planName, setPlanName] = useState(p.planName || "");
  const [policyNo, setPolicyNo] = useState(p.policyNo || "");
  const [phone, setPhone] = useState(p.phone || "");
  const [serviceFee, setServiceFee] = useState(p.serviceFee || "");
  const [effective, setEffective] = useState(p.effectiveDate || p.effective || "");
  const [renewal, setRenewal] = useState(p.renewalDate || p.renewal || "");
  const [coveredSystems, setCoveredSystems] = useState(p.coveredSystems || "");
  const [coveredAppliances, setCoveredAppliances] = useState(p.coveredAppliances || "");
  const [notes, setNotes] = useState(p.notes || "");
  const doc = sourceDoc || (policy && policy.doc) || null;
  const save = () => {
    const pr = provider.trim();
    if(!pr) return;
    const now = nowISO();
    onSave({
      ...(policy || {}), id: (policy && policy.id) || uid(), home_id: (policy && policy.home_id) || homeId,
      provider: pr, kind, planName: planName.trim(), policyNo: policyNo.trim(), phone: phone.trim(),
      serviceFee: serviceFee.trim(),
      effective: effective || null, renewal: renewal || null,
      coveredSystems: coveredSystems.trim(), coveredAppliances: coveredAppliances.trim(),
      doc: doc ? { id: doc.id, name: doc.name, path: doc.path } : ((policy && policy.doc) || null),
      notes: notes.trim(),
      createdAt: (policy && policy.createdAt) || now, updatedAt: now,
    });
  };
  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">{policy ? "Edit coverage" : "Add coverage"}</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>
        <label className="field-label">Provider</label>
        <input className="input" value={provider} onChange={e=>setProvider(e.target.value)} placeholder="e.g. American Home Shield" autoFocus />
        <label className="field-label">Type</label>
        <div className="pills">
          {POLICY_KINDS.map(k =>
            <button key={k} className={"pill "+(kind===k?"on":"")} onClick={()=>setKind(k)}>{k}</button>)}
        </div>
        <label className="field-label">Plan name</label>
        <input className="input" value={planName} onChange={e=>setPlanName(e.target.value)} placeholder="e.g. ShieldComplete Buyer" />
        <label className="field-label">Policy / plan number</label>
        <input className="input" value={policyNo} onChange={e=>setPolicyNo(e.target.value)} placeholder="Optional" />
        <label className="field-label">Claims phone</label>
        <input className="input" type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Optional" />
        <label className="field-label">Service fee per visit</label>
        <input className="input" value={serviceFee} onChange={e=>setServiceFee(e.target.value)} placeholder="e.g. $100.00" />
        <div className="hint">The number to weigh against a contractor's own diagnostic charge.</div>
        <div className="row">
          <div className="field" style={{flex:1}}>
            <label className="field-label">Effective</label>
            <input className="input" type="date" value={effective||""} onChange={e=>setEffective(e.target.value)} />
          </div>
          <div className="field" style={{flex:1}}>
            <label className="field-label">Renews</label>
            <input className="input" type="date" value={renewal||""} onChange={e=>setRenewal(e.target.value)} />
          </div>
        </div>
        <label className="field-label">Covered systems</label>
        <textarea className="input" style={{minHeight:64, resize:"vertical"}} value={coveredSystems}
          onChange={e=>setCoveredSystems(e.target.value)} placeholder="e.g. Heating; Air Conditioning System; Ductwork" />
        <label className="field-label">Covered appliances</label>
        <textarea className="input" style={{minHeight:56, resize:"vertical"}} value={coveredAppliances}
          onChange={e=>setCoveredAppliances(e.target.value)} placeholder="Optional" />
        {doc &&
          <div className="hint" style={{marginTop:8}}>
            Read from <strong>{doc.name}</strong>, kept in your documents.
          </div>}
        <label className="field-label">Notes</label>
        <textarea className="input" style={{minHeight:70, resize:"vertical"}} value={notes} onChange={e=>setNotes(e.target.value)}
          placeholder="Waiting periods, caps, how to file." />
        <button className="btn btn-primary btn-block" style={{marginTop:14}} disabled={!provider.trim()} onClick={save}>
          {policy ? "Save changes" : "Add coverage"}
        </button>
        {policy &&
          <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>onDelete(policy)}>
            <Icon d={ICONS.trash} size={15}/> Delete
          </button>}
      </div>
    </>
  );
}

   document already filed, upload the document (it lands in the vault like any
   other, categorized and deduped), or key it in. */

      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">Add coverage</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>
        <div style={{display:"flex", flexDirection:"column", gap:10}}>
          <button className="btn btn-ghost btn-block" onClick={onFromDocs}>
            <Icon d={ICONS.doc} size={17}/> Find it in my documents
          </button>
          <button className="btn btn-ghost btn-block" onClick={onUpload}>
            <Icon d={ICONS.upload} size={17}/> Upload the policy document

// Pick a stored document to read. Coverage-looking ones surface first, but
// everything stays searchable, because filing is never perfect.
function DocPickerSheet({ docs, onPick, onClose }){
  const [q, setQ] = useState("");
  const query = q.trim().toLowerCase();
  const likely = (d) => {
    const hay = ((d.name||"") + " " + (d.sourceName||"") + " " + migrateDocCat(d.category)).toLowerCase();
    return /warrant|insur|policy|coverage|home shield|\bahs\b|plan|declaration|dec page/.test(hay);
  };
  const matched = query
    ? docs.filter(d => ((d.name||"") + " " + (d.sourceName||"")).toLowerCase().includes(query))
    : docs.filter(likely);
  const sorted = matched.slice().sort((a,b) =>
    (likely(b)?1:0) - (likely(a)?1:0) ||
    String(a.name||"").localeCompare(String(b.name||""), undefined, {numeric:true}));
  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">Which document?</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>
        <input className="input" value={q} onChange={e=>setQ(e.target.value)}
          placeholder="Search all documents" aria-label="Search documents" autoFocus />
        <div className="hint">
          {query ? matched.length + " match" + (matched.length===1?"":"es")
                 : "Showing likely coverage documents. Search to see all " + docs.length + "."}
        </div>
        <div className="list" style={{marginTop:6, maxHeight:"46vh", overflowY:"auto"}}>
          {sorted.map(d => (
            <button key={d.id} className="item" onClick={()=>onPick(d)}>
              <div className="item-body">
                <div className="item-title">{d.name}</div>
                <div className="item-meta">
                  <span className="chip">{migrateDocCat(d.category)}</span>
                  <span className="chip">{fileKind(d.path, d.mime)}</span>
                  {d.size ? <span className="chip">{humanSize(d.size)}</span> : null}
                </div>
              </div>
            </button>
          ))}
          {!sorted.length &&
            <div className="empty" style={{padding:"30px 20px"}}>
              <p>{query ? 'Nothing matches "'+q+'".' : "No likely coverage documents found. Search by name."}</p>
            </div>}
        </div>
      </div>
    </>
  );
}

function CoverageScreen({ store, home, onAdd, onEdit, onDelete }){
  const all = (store.data.policies||[]).filter(p => p.home_id === home.id);
  if(!all.length){

      <div className="empty">
        <div className="glyph">◇</div>
        <h3 className="title-sm">No coverage recorded</h3>
        <p>Home warranty, homeowners insurance, service plans. Recording them here means that when something breaks, {home.name} reminds you to file a claim before you authorize the work.</p>
        <button className="btn btn-primary" style={{marginTop:18}} onClick={onAdd}>
          <Icon d={ICONS.plus} size={16}/> Add coverage
        </button>

  }
  return (
    <div>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
        <div className="log-summary">{all.length} {all.length===1?"policy":"policies"}</div>
        <button className="assist-toggle" style={{marginTop:14, whiteSpace:"nowrap"}} onClick={onAdd}>+ Add</button>

        {all.map(p => (

                <div className="item-title">{p.provider}</div>
                {p.planName ? <div style={{fontSize:12.5, color:"var(--ink-3)", marginTop:3}}>{p.planName}</div> : null}
                <div className="item-meta">
                  <span className="chip">{p.kind}</span>
                  {p.serviceFee && <span className="chip amber">{p.serviceFee} per visit</span>}
                  {p.policyNo && <span className="chip">#{p.policyNo}</span>}
                  {p.phone && <span className="chip">{p.phone}</span>}

              </button>
              <button className="rem-done" onClick={()=>onEdit(p)} aria-label="Edit"><Icon d={ICONS.edit} size={16}/></button>
            </div>
          </SwipeRow>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   JOB SHEET - the whole incident on one screen
   ============================================================ */
/* Picking equipment out of a long Systems & Notes list needs search, not a
   native <select>: the list also holds vendors, contact lists and general
   notes, so the real equipment has to be findable rather than scrolled to.
   Inline rather than a nested sheet, which would stack scrims. */
function SystemPicker({ systems, value, onChange, onCreate, placeholder }){
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const chosen = (systems||[]).find(s => s.id === value) || null;
  const hasGear = (s) => !!(s.equipment && (s.equipment.model || s.equipment.make || s.equipment.serial));
  const query = q.trim().toLowerCase();
  const matched = (systems||[]).filter(s => {
    if(!query) return true;
    const eq = s.equipment || {};
    return ((s.title||"") + " " + (s.section||"") + " " + (eq.make||"") + " " + (eq.model||"") + " " + (s.notes||""))
      .toLowerCase().includes(query);
  }).sort((a,b) =>
    (hasGear(b)?1:0) - (hasGear(a)?1:0) ||                       // real equipment first
    String(a.section||"").localeCompare(String(b.section||"")) ||
    String(a.title||"").localeCompare(String(b.title||""), undefined, {numeric:true}));

  if(!open){
    return (
      <button className="select" style={{width:"100%", textAlign:"left", cursor:"pointer"}} onClick={()=>{ setOpen(true); setQ(""); }}>
        {chosen ? chosen.title : (placeholder || "Not sure yet")}
      </button>
    );
  }
  return (
    <div>
      <input className="input" value={q} onChange={e=>setQ(e.target.value)} autoFocus
        placeholder={"Search " + (systems||[]).length + " systems & notes"} aria-label="Search systems" />
      <div className="list" style={{marginTop:6, maxHeight:"34vh", overflowY:"auto"}}>
        {/* Nothing fits? Name it here rather than leaving and losing your place. */}
        {onCreate && q.trim() && !matched.some(x => (x.title||"").toLowerCase() === q.trim().toLowerCase()) &&
          <button className="item" onClick={()=>{ const id = onCreate(q.trim()); if(id){ onChange(id); setOpen(false); } }}>
            <span className="sys-ic"><Icon d={ICONS.plus} size={16}/></span>
            <div className="item-body">
              <div className="item-title">Create "{q.trim()}"</div>
              <div className="item-meta"><span className="chip amber">new system</span></div>
            </div>
          </button>}
        <button className="item" onClick={()=>{ onChange(""); setOpen(false); }}>
          <div className="item-body"><div className="item-title" style={{opacity:.7}}>Not tied to a system</div></div>
        </button>
        {matched.map(s => {
          const eq = s.equipment || {};
          const age = equipmentAge(eq.manufactureDate || eq.installedDate);
          const spec = [eq.make, eq.model].filter(Boolean).join(" ");
          return (
            <button key={s.id} className="item" onClick={()=>{ onChange(s.id); setOpen(false); }}>
              <span className="sys-ic"><Icon d={systemIcon(s)} size={16}/></span>
              <div className="item-body">
                <div className="item-title">{s.title}</div>
                <div className="item-meta">
                  {spec && <span className="chip amber">{spec}</span>}
                  {age && <span className="chip">{age.label}</span>}
                  {s.section && <span className="chip">{s.section}</span>}
                </div>
              </div>
            </button>
          );
        })}
        {!matched.length &&
          <div className="empty" style={{padding:"26px 18px"}}><p>Nothing matches "{q}".</p></div>}
      </div>
      <button className="assist-toggle" style={{marginTop:6}} onClick={()=>setOpen(false)}>Cancel</button>
    </div>
  );
}

function JobSheet({ job, homeId, homes, systems, policies, history, onCreateSystem, onSave, onDelete, onLogVisit, onLogReceipt, onEditEntry, onClose }){
  const j = job || {};
  const [title, setTitle] = useState(j.title || "");
  const [symptom, setSymptom] = useState(j.symptom || "");
  // An issue raised against the wrong house should be movable, not re-typed.
  const [ownerHome, setOwnerHome] = useState(j.home_id || homeId);
  const [systemId, setSystemId] = useState(j.system_id || "");
  const [status, setStatus] = useState(j.status || "open");
  const [cov, setCov] = useState(j.coverage || {});
  const [waiting, setWaiting] = useState(j.waitingOn || []);
  const [notes, setNotes] = useState(j.notes || "");
  const setCovField = (k,v) => setCov(p => ({ ...p, [k]: v }));

  const moved = ownerHome !== (j.home_id || homeId);
  const mySystems  = (systems||[]).filter(x => x.home_id === ownerHome && x.kind !== "vendor" && x.kind !== "note");
  const myPolicies = (policies||[]).filter(x => x.home_id === ownerHome);
  const sys = mySystems.find(s => s.id === systemId) || null;
  const eq = (sys && sys.equipment) || {};
  const age = equipmentAge(eq.manufactureDate || eq.installedDate);
  const spend = (history||[]).reduce((s,e) => s + (Number(e.cost)||0), 0);

  const save = () => {
    const t = title.trim();
    if(!t) return;
    const now = nowISO();
    const clean = {};
    Object.keys(cov).forEach(k => { const v = String(cov[k]||"").trim(); if(v) clean[k] = v; });
    onSave({
      ...j, id: j.id || uid(), home_id: ownerHome,
      title: t, symptom: symptom.trim(), system_id: moved ? null : (systemId || null),
      status, waitingOn: waiting.length ? waiting : null,
      coverage: (moved || !Object.keys(clean).length) ? null : clean, notes: notes.trim(),
      openedAt: j.openedAt || todayStr(),
      resolvedAt: jobState(status).done ? (j.resolvedAt || todayStr()) : null,
      createdAt: j.createdAt || now, updatedAt: now,
    });
  };

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">{job ? "Issue" : "What's wrong?"}</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>

        <label className="field-label">What's happening</label>
        <input className="input" value={title} onChange={e=>setTitle(e.target.value)}
          placeholder="e.g. North AC not cooling" autoFocus={!job} />

        {homes && homes.length > 1 &&
          <>
            <label className="field-label">Which home</label>
            <select className="select" value={ownerHome} onChange={e=>{ setOwnerHome(e.target.value); setSystemId(""); setCov({}); }}>
              {homes.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
            </select>
            {moved && <div className="hint" style={{color:"var(--amber)"}}>
              Moving this issue to another home. Its system and coverage are cleared, since those belong to the house it is leaving. Any logged visits move with it.
            </div>}
          </>}

        {mySystems.length > 0 &&
          <>
            <label className="field-label">Which system</label>
            <SystemPicker systems={mySystems} value={systemId} onChange={setSystemId}
              onCreate={onCreateSystem ? (t)=>onCreateSystem(t, ownerHome) : null} />
          </>}

        {/* The repair-or-replace context, on screen while the decision is live. */}
        {sys && (eq.model || age) &&
          <div className="hint" style={{marginTop:8}}>
            {[eq.make, eq.model].filter(Boolean).join(" ")}
            {age ? " · " + age.label : ""}
            {eq.warranty === "notRegistered" ? " · not registered, parts out of pocket"
              : eq.warranty === "registered" ? " · warranty registered" : ""}
          </div>}

        <label className="field-label">Where it stands</label>
        <div className="pills">
          {JOB_STATES.map(s =>
            <button key={s.k} className={"pill "+(status===s.k?"on":"")} onClick={()=>setStatus(s.k)}>{s.label}</button>)}
        </div>

        <label className="field-label">Waiting on</label>
        <div className="pills">
          {WAITING_ON.map(w =>
            <button key={w.k} className={"pill "+(waiting.includes(w.k)?"on":"")}
              onClick={()=>setWaiting(v => v.includes(w.k) ? v.filter(x=>x!==w.k) : [...v, w.k])}>{w.label}</button>)}
        </div>
        <div className="hint">Pick as many as apply. An issue is usually stuck on more than one thing at once.</div>

        {/* Coverage: the prompt that stops money going out the door needlessly. */}
        <label className="field-label">Coverage</label>
        {myPolicies.length > 0 ? (
          <>
            <select className="select" value={cov.policyId||""} onChange={e=>setCovField("policyId", e.target.value)}>
              <option value="">Not using coverage</option>
              {myPolicies.map(p => <option key={p.id} value={p.id}>{p.provider}{p.kind ? " · "+p.kind : ""}</option>)}
            </select>
            {cov.policyId && !String(cov.claimNo||"").trim() &&
              <div className="hint" style={{color:"var(--amber)"}}>
                File the claim before authorizing any work. Most policies only pay for repairs their own
                contractor diagnoses, so work you arrange first usually isn't reimbursed.
              </div>}
            {cov.policyId &&
              <>
                <label className="field-label">Claim number</label>
                <input className="input" value={cov.claimNo||""} onChange={e=>setCovField("claimNo", e.target.value)} placeholder="Once filed" />
                <label className="field-label">Coverage decision</label>
                <textarea className="input" style={{minHeight:64, resize:"vertical"}} value={cov.determination||""}
                  onChange={e=>setCovField("determination", e.target.value)}
                  placeholder="What the warranty company decides: covered, denied, partial, and why." />
                <div className="hint">The insurer&rsquo;s answer. A contractor&rsquo;s findings belong on their visit in the timeline.</div>
              </>}
          </>
        ) : (
          <div className="hint">No coverage recorded for this home yet. Add a home warranty or insurance policy under Coverage and it will show up here.</div>
        )}

        <label className="field-label">Symptom &amp; details</label>
        <textarea className="input" style={{minHeight:80, resize:"vertical"}} value={symptom} onChange={e=>setSymptom(e.target.value)}
          placeholder="What it's doing, when it started, any codes shown." />

        {job &&
          <>
            <div className="field-label" style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}}>
              <span>Timeline{history && history.length ? " ("+history.length+")" : ""}</span>
              {spend > 0 && <span className="chip">${fmtNum(spend)} so far</span>}
            </div>
            {history && history.length > 0 ? (
              <div className="list" style={{marginTop:0, maxHeight:"24vh", overflowY:"auto"}}>
                {history.map(e => (
                  <button key={e.id} className="item" onClick={()=>onEditEntry && onEditEntry(e)}>
                    <div className="item-body">
                      <div className="item-title">{e.title}</div>
                      <div className="item-meta">
                        {e.date ? <span className="chip">{fmtDate(e.date)}</span> : <span className="chip">No date</span>}
                        {e.cost!=null && e.cost!=="" && <span className="chip">${fmtNum(e.cost)}</span>}
                        {e.vendor && <span className="chip">{e.vendor}</span>}
                        {e.receipt && <span className="chip">invoice</span>}
                      </div>
                    </div>
                    <span className="hub-card-chev"><Icon d={ICONS.chev} size={16}/></span>
                  </button>
                ))}
              </div>
            ) : <div className="hint">Nothing logged against this issue yet.</div>}
            <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>onLogVisit(job, systemId)}>
              <Icon d={ICONS.plus} size={15}/> Log a visit or estimate
            </button>
            {onLogReceipt &&
              <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>onLogReceipt(job, systemId)}>
                <Icon d={ICONS.doc} size={15}/> From an invoice or estimate
              </button>}
            <div className="hint">The second one reads the paperwork: it files the invoice with your documents and fills in the vendor, date and amount.</div>
          </>}

        <label className="field-label">Notes</label>
        <textarea className="input" style={{minHeight:64, resize:"vertical"}} value={notes} onChange={e=>setNotes(e.target.value)}
          placeholder="Questions to ask, who said what." />

        <button className="btn btn-primary btn-block" style={{marginTop:14}} disabled={!title.trim()} onClick={save}>
          {job ? "Save changes" : "Open the issue"}
        </button>
        {job &&
          <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>onDelete(job)}>
            <Icon d={ICONS.trash} size={15}/> Delete
          </button>}
      </div>
    </>
  );
}

// Section tabs shown INSIDE a home in the bottom nav. The houses list is the
// level above these. "systems" is a full section too but reached from the
// overview hub card (kept out of the 4-slot bottom nav), so it has a label here.
const HOME_TABS = [
  { key:"overview", label:"Home",      icon:ICONS.home },
  { key:"docs",     label:"Docs",      icon:ICONS.doc  },
  { key:"log",      label:"Log",       icon:ICONS.log  },
  { key:"systems",  label:"Systems",   icon:ICONS.tool },
];
const SECTION_LABELS = { overview:"Home", docs:"Docs", log:"Log", remind:"Reminders",
  systems:"Systems", vendors:"Vendors", notes:"Notes", coverage:"Coverage" };

function App(){
  const store = useStore();
  const [view, setView] = useState("houses");   // "houses" (top level) | "home" (inside one)
  const [tab, setTab] = useState("overview");    // section within a home
  const [navStack, setNavStack] = useState([]);  // in-home back trail (tab keys)
  const [sheet, setSheet] = useState(null);   // null | {home}
  const [addSheet, setAddSheet] = useState(false);      // center-+ Add sheet (in-home)
  const [eventSheet, setEventSheet] = useState(null);   // null | {event}
  const [remSheet, setRemSheet] = useState(null);       // null | {reminder, preset}
  const [docSheet, setDocSheet] = useState(null);       // null | {doc}
  const [sysSheet, setSysSheet] = useState(null);       // null | {system}
  const [organize, setOrganize] = useState(null);       // null | {rows}
  const [jobSheet, setJobSheet] = useState(null);       // null | {job}
  const [polSheet, setPolSheet] = useState(null);       // null | {policy, prefill, sourceDoc}
  const [covChooser, setCovChooser] = useState(false);
  const [docPicker, setDocPicker] = useState(false);
  const [docBusy, setDocBusy] = useState("");           // "" | "Adding 3 of 16..."
  const [importOpen, setImportOpen] = useState(false);
  const [trelloReview, setTrelloReview] = useState(null);
  const [importHomeId, setImportHomeId] = useState(null);
  const docFileRef = useRef(null);
  const docPhotoRef = useRef(null);
  const docDirRef = useRef(null);
  const receiptFileRef = useRef(null);
  const receiptForRef = useRef(null);   // {job_id, system_id} when raised from an issue
  const trelloFileRef = useRef(null);
  const homePhotoRef = useRef(null);
  const coverageIntent = useRef(false);   // set when the import sheet was opened to add coverage
  const homePhotoTargetRef = useRef(null);
  // webkitdirectory can't be set through JSX reliably, so stamp it on the hidden
  // folder input after mount. `directory` covers Firefox. This makes the picker
  // choose a FOLDER and return every file down the tree (desktop browsers only;
  // iOS has no folder picker).
  useEffect(() => {
    if(docDirRef.current){
      docDirRef.current.setAttribute("webkitdirectory", "");
      docDirRef.current.setAttribute("directory", "");
    }
  }, []);
  // The device picker fires its onChange long after the sheet closes, so the
  // chosen home rides in a ref rather than relying on closure timing.
  const importHomeRef = useRef(null);

  // Preload the Dropbox Chooser (if configured) so choose() runs inside the
  // click gesture instead of after an async load, which browsers would block.
  useEffect(() => { if(DROPBOX_APP_KEY) ensureDropbox().catch(()=>{}); }, []);
  const [inSettings, setInSettings] = useState(false);
  const [toast, setToast] = useState("");
  const [update,setUpdate]=useState(null);   // { ver, build } of a newer deployed build, else null
  const [updMsg,setUpdMsg]=useState("");     // inline status for the Settings "Check for updates" row
  const updTimer = useRef(null);

  const showToast = (m) => { setToast(m); setTimeout(()=>setToast(""), 2200); };

  // Show a status line for a few seconds then clear it (used for terminal results).
  const flashUpd = useCallback((msg)=>{ setUpdMsg(msg); if(updTimer.current) clearTimeout(updTimer.current); updTimer.current = setTimeout(()=>setUpdMsg(""), 4000); },[]);
  // PWA self-update: fetch the deployed index.html (no-store), regex the build,
  // compare with buildIsNewer. Bump BUILD on every deploy or this never fires.
  // manual=true is the Settings button: show inline "Checking..." then a result. On
  // launch/resume we check quietly and only surface the banner if there's an update.
  // Detection compares the deployed BUILD (monotonic date stamp) so it never misfires;
  // the deployed APP_VERSION is read alongside it purely to LABEL the update ("v0.9.9").
  const checkUpdate = useCallback(async (manual=false)=>{
    if(manual){ if(updTimer.current) clearTimeout(updTimer.current); setUpdMsg("Checking..."); }
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache:"no-store" });
      if(!res.ok){ log("UPDATE","check http "+res.status); if(manual) flashUpd("Couldn't check - are you online?"); return; }
      const html = await res.text();
      const mb = html.match(/const BUILD = "([^"]+)";/);       const rBuild = mb && mb[1];
      const mv = html.match(/const APP_VERSION = "([^"]+)";/); const rVer = mv && mv[1];
      if(rBuild && buildIsNewer(rBuild, BUILD)){ log("UPDATE","newer build live: "+rBuild+" (v"+(rVer||"?")+")"); setUpdate({ ver:rVer, build:rBuild }); if(manual) setUpdMsg(""); }
      else { log("UPDATE","up to date (v"+APP_VERSION+", "+BUILD+")"); setUpdate(null); if(manual) flashUpd("You're on the latest (v"+APP_VERSION+")"); }
    }catch(e){ log("UPDATE","check failed: "+e.message); if(manual) flashUpd("Update check failed"); }
  },[flashUpd]);

  // Apply by navigating to a build-stamped URL so iOS can't serve the cached HTML.
  // Wipe the SW caches first so the new build can never be masked by a cached shell.
  function applyUpdate(){
    const stamp=(update&&update.build)||String(Date.now());
    log("UPDATE","applying -> "+stamp);
    try{ if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("clearCache"); }catch(_){}
    window.location.replace(location.pathname + "?u=" + encodeURIComponent(stamp));
  }
  // Check on launch, on RESUME, and periodically while open. WHY: an installed
  // PWA is almost always resumed from the background rather than cold-launched,
  // so a launch-only check means the banner never surfaces on a phone. Debounced
  // so a burst of visibility events can't refetch repeatedly. (Ported from
  // MenuCaptain, which hit exactly this problem.)
  useEffect(() => {
    let lastCheck = 0;
    const MIN_GAP = 60 * 1000;                  // never refetch more than once a minute
    const maybeCheck = () => {
      const now = Date.now();
      if(now - lastCheck < MIN_GAP) return;
      lastCheck = now;
      checkUpdate(false);
    };
    const t = setTimeout(maybeCheck, 1200);     // initial launch check
    const onVis = () => { if(document.visibilityState === "visible") maybeCheck(); };
    document.addEventListener("visibilitychange", onVis);

  // ---- document handlers ----
  // Batch add: each picked file becomes its own auto-classified document. Uploads
  // run one at a time so the progress count is honest and memory stays bounded.
  const addDocuments = async (fileList, homeId, quiet) => {
    const files = Array.from(fileList || []);
    if(!files.length) return;
    // Snapshot existing docs so re-selecting the whole folder dedupes against
    // what's already here. We track adds + replacements against this base and
    // save once at the end.
    const base = store.data.documents || [];
    const added = [];
    const replacements = {};     // docId -> updated record
    const oldPathsToDelete = [];
    let skipped = 0, unchanged = 0, revised = 0;
    for(let i=0; i<files.length; i++){
      const f = files[i];
      // A folder pick carries a path ("656 River Way/Closing/cd.pdf"): natively
      // via webkitRelativePath (input) or via _rel (showDirectoryPicker walk).
      // A plain file pick has neither, so this handles all three. `rel` is the
      // dedupe identity and `baseName` is the display filename.
      const rel = f.webkitRelativePath || f._rel || f.name;
      const baseName = rel.split("/").pop();
      setDocBusy("Adding " + (i+1) + " of " + files.length + "…");
      if(isJunkFile(rel)){ skipped++; continue; }
      if(f.size === 0){ skipped++; continue; }                 // empty/placeholder files
      if(f.size > DOC_MAX_BYTES){ skipped++; log("DOC","skipped oversize "+rel+" ("+humanSize(f.size)+")"); continue; }
      const verdict = classifyIncoming(base, homeId, rel, f.size);
      if(verdict.action === "skip"){ unchanged++; continue; }
      try{
        const dataUrl = await fileToDataURL(f);
        const docId = verdict.action === "replace" ? verdict.doc.id : uid();
        const path = "documents/" + docId + "/" + Date.now().toString(36) + "-" + safeName(baseName);
        await uploadFile(path, dataUrl);
        if(verdict.action === "replace"){
          // Keep the record (category, note, applied facts stay), swap the file,
          // and clear the cached AI read since the content changed.
          if(verdict.doc.path && verdict.doc.path !== path) oldPathsToDelete.push(verdict.doc.path);
          replacements[docId] = { ...verdict.doc, path, size: f.size,
            mime: f.type || (isPdfName(baseName) ? "application/pdf" : ""),
            sourceName: rel, extracted: undefined, updatedAt: nowISO() };
          revised++;
        } else {
          added.push({
            id: docId, home_id: homeId,
            name: stripExt(baseName), category: classifyDoc(rel),
            path, size: f.size, mime: f.type || (isPdfName(baseName) ? "application/pdf" : ""),
            sourceName: rel, note: "", createdAt: nowISO(), updatedAt: nowISO(),
          });
        }
      }catch(e){ skipped++; log("ERROR","addDocuments "+rel+": "+e.message); }
    }
    setDocBusy("");
    if(added.length || Object.keys(replacements).length){
      const merged = base.map(d => replacements[d.id] || d);
      store.saveCollection("documents", [...added, ...merged]);
      oldPathsToDelete.forEach(p => deleteFile(p));   // best-effort storage cleanup
    }
    afterImportForCoverage([...added, ...Object.values(replacements)]);
    const parts = [];
    if(added.length) parts.push(added.length + " added");
    if(revised) parts.push(revised + " updated");
    if(unchanged) parts.push(unchanged + " unchanged");
    if(skipped) parts.push(skipped + " skipped");
    if(!quiet) showToast(parts.length ? parts.join(", ") : "Nothing added");
    // Return what landed so callers (e.g. adding coverage from a document) can
    // act on the stored record instead of re-uploading it down a side channel.
    return { added, replaced: Object.values(replacements) };
  };

  const handleFolder = () => {
    const homes = store.data.homes || [];
    const ah = homes.find(h => h.id === store.cfg.activeHomeId) || homes[0] || null;
    if(!ah) return;

      setImportOpen(false);

        for await (const entry of handle.values()){
          const rel = prefix ? prefix + "/" + entry.name : entry.name;
          if(entry.kind === "file"){
            const f = await entry.getFile();
            try { Object.defineProperty(f, "webkitRelativePath", { value: rel, configurable:true }); } catch(e){}
            try { f._rel = rel; } catch(e){}
            files.push(f);
          } else if(entry.kind === "directory"){
            await walk(entry, rel);
          }
        }
      };
      try { await walk(dir, dir.name); } catch(e){ log("ERROR","folder walk: " + e.message); }
      setDocBusy("");
      if(files.length) addDocuments(files, ah.id);
      else showToast("That folder had no files.");

      if(e && e.name === "AbortError") return;    // user cancelled - not an error

      const byName = {}; cards.forEach(c => { byName[(c.name||"").trim().toLowerCase()] = c; });

      log("TRELLO", cards.length + " cards -> " + entries.length + " entries " + JSON.stringify(res.counts || {}));
      setTrelloReview({ entries, homeId: ah.id, boardName: json.name || "Trello board", attach,
                        cardCount: (res && res.cardCount) || cards.length });
