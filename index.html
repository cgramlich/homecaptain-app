    if(!mine.length){ showToast("Nothing to organize yet."); return; }
    // Rules first: field presence settles most of these instantly, offline, and
    // the same way every time. The model is for what the rules cannot call, plus
    // titles that are carrying filler and want rewriting.
    const FILLER = /\b(reference|details|info|overview|misc|general)\b/i;
    const judged = mine.map(x => ({ x, r: classifyEntry(x) }));
    const needsModel = judged.filter(({x, r}) =>
      r.confidence === "low" || r.kind === "mixed" || FILLER.test(x.title||"") || (x.title||"").length > 46);

    let ai = {};
    if(needsModel.length){
      setDocBusy("Rules sorted " + (mine.length - needsModel.length) + ", asking about " + needsModel.length + "...");
      try{
        const payload = needsModel.map(({x}) => ({ id:x.id, title:x.title||"", section:x.section||"",
                                                   notes:String(x.notes||"").slice(0,400) }));
        const res = await organizeSystems(payload);
        (res.entries||[]).forEach(r => { ai[r.id] = r; });
      }catch(e){
        // The rules still stand on their own, so a failed call degrades rather
        // than blocking the whole tidy-up.
        showToast("Sorted locally; the AI pass failed (" + (e.message||"") + ")");
      }
    }
    setDocBusy("");

    const rows = judged.map(({x, r}) => {
      const a = ai[x.id] || null;
      const kind = a ? (a.kind || r.kind) : r.kind;
      const title = (a && a.title) || x.title;
      const section = (a && a.section) || x.section || "";
      const changed = title !== x.title || section !== (x.section||"") || kind !== (x.kind||"");
      return { id:x.id, was:x.title, title, section,
               kind: kind === "mixed" ? "equipment" : kind,
               needsSplit: r.kind === "mixed",
               confidence: a ? "ai" : r.confidence,
               why: r.kind === "mixed" ? r.why : (a ? "read by AI" : r.why),
               trade:(a && a.trade)||null, phone:(a && a.phone)||null, changed };
    });
    if(!rows.length){ showToast("Nothing to organize."); return; }
    // Look for the same thing written twice, on the names as they will READ
    // after the tidy-up, so a rename that reveals a duplicate still catches it.
    const dupGroups = findDuplicates(rows.map(r => ({ id:r.id, title:r.title })));
    // For each duplicate group, recommend keeping the entry that carries the
    // most: a nameplate, a photo, attached notes, the longest description. The
    // keeper can never be deleted, so a group can never be wiped out entirely.
    const byId = {}; mine.forEach(x => { byId[x.id] = x; });
    const richness = (x) => {
      if(!x) return -1;
      const eq = x.equipment || {};
      return (eq.model || eq.serial || eq.make ? 40 : 0)
           + (x.photo ? 12 : 0)
           + ((x.linkedIds||[]).length * 6)
           + ((x.attachments||[]).length * 3)
           + Math.min(20, Math.round(String(x.notes||"").length / 25))
           + (x.trade || x.phone ? 4 : 0);
    };
    const dupKeep = {};                    // group index -> id we keep
    dupGroups.forEach((g, i) => {
      let best = g[0], bestScore = richness(byId[g[0]]);
      g.forEach(id => { const sc = richness(byId[id]); if(sc > bestScore){ best = id; bestScore = sc; } });
      dupKeep[i] = best;
    });
    log("ORGANIZE", mine.length + " entries, " + needsModel.length + " to AI, " + dupGroups.length + " dup groups");
    setOrganize({ rows, dupGroups, dupKeep, localCount: mine.length - needsModel.length, aiCount: needsModel.length });
  };
  const applyOrganize = (chosen, removeIds) => {
    const gone = new Set(removeIds || []);
    if(gone.size && !confirm("Delete " + gone.size + " entr" + (gone.size===1?"y":"ies") +
        " marked redundant? The ones you kept are not affected.")) return;
    const pick = {}; chosen.forEach(r => { pick[r.id] = r; });
    const now = nowISO();
    const next = (store.data.systems||[])
      .filter(x => !gone.has(x.id))
      .map(x => {
        const r = pick[x.id];
        if(!r) return x;
        // Rename and reclassify only. Notes, equipment, photos and links are
        // untouched - this is a tidy-up, not a rewrite.
        return { ...x, title:r.title, section:r.section, kind:r.kind,
                 trade:r.trade || x.trade || null, phone:r.phone || x.phone || null,
                 updatedAt:now };
      });
    store.saveCollection("systems", next);
    // A deleted entry must not leave an issue or a log entry pointing at nothing.
    if(gone.size){
      const evs = store.data.events || [];
      if(evs.some(e => gone.has(e.system_id)))
        store.saveCollection("events", evs.map(e => gone.has(e.system_id) ? {...e, system_id:null, updatedAt:now} : e));
      const jbs = store.data.jobs || [];
      if(jbs.some(j => gone.has(j.system_id)))
        store.saveCollection("jobs", jbs.map(j => gone.has(j.system_id) ? {...j, system_id:null, updatedAt:now} : j));
    }
    setOrganize(null);
    const bits = [];
    if(chosen.length) bits.push(chosen.length + " organized");
    if(gone.size) bits.push(gone.size + " deleted");
    showToast(bits.join(", ") || "Nothing changed");
  };

  // ---- systems & notes ----
  // Create a bare system inline (from a picker) and hand back its id, so an
  // issue can attach to equipment that did not exist a second ago.
  const createSystemQuick = (title, forHome) => {
    const t = String(title||"").trim();
    if(!t) return null;
    const now = nowISO();
    const rec = { id: uid(), home_id: forHome, title: t, section: "", notes: "",
                  equipment: null, installer: "", photo: null, linkedIds: null,
                  source: "manual", createdAt: now, updatedAt: now };
    store.saveCollection("systems", [rec, ...(store.data.systems||[])]);
    showToast("Added " + t + " - scan its plate in Systems & Notes");
    return rec.id;
  };
  const saveSystem = (rec) => {
    const list = store.data.systems || [];
    const next = list.some(s => s.id === rec.id) ? list.map(s => s.id===rec.id ? rec : s) : [rec, ...list];
    store.saveCollection("systems", next);
    setSysSheet(null);
    showToast(list.some(s => s.id === rec.id) ? "Note updated" : "Note added");
  };
  const deleteSystem = (s) => {
    store.saveCollection("systems", (store.data.systems||[]).filter(x => x.id !== s.id));
    setSysSheet(null);
    showToast("Note deleted");
  };

  // ---- home photo ----
  const pickHomePhoto = (homeId) => { homePhotoTargetRef.current = homeId; if(homePhotoRef.current) homePhotoRef.current.click(); };
  const onHomePhotoFile = async (e) => {
    const file = (e.target.files||[])[0];
    e.target.value = "";
    const homeId = homePhotoTargetRef.current;
    if(!file || !homeId) return;
    setDocBusy("Adding photo…");
    try{
      const b64 = await resizeImage(file);
      const path = "homes/" + homeId + "/" + Date.now().toString(36) + ".jpg";
      await uploadFile(path, b64);
      const homes = store.data.homes || [];
      const old = (homes.find(h => h.id === homeId)||{}).photo;
      store.saveCollection("homes", homes.map(h => h.id===homeId ? {...h, photo:path, updatedAt:nowISO()} : h));
      if(old && old !== path) deleteFile(old);
      setDocBusy(""); showToast("Photo added");
    }catch(err){ setDocBusy(""); showToast(err.message || "Couldn't add the photo"); }
  };
  const removeHomePhoto = (homeId) => {
    const homes = store.data.homes || [];
    const home = homes.find(h => h.id === homeId);
    if(!home || !home.photo) return;
    const old = home.photo;
    store.saveCollection("homes", homes.map(h => h.id===homeId ? {...h, photo:null, updatedAt:nowISO()} : h));
    deleteFile(old);
    showToast("Photo removed");
  };
  // Open the import sheet aimed at the currently active home.
  const openImport = () => {
    const homes = store.data.homes || [];
    const ah = homes.find(h => h.id === store.cfg.activeHomeId) || homes[0] || null;
    const id = ah ? ah.id : null;
    setImportHomeId(id); importHomeRef.current = id;
    setImportOpen(true);
  };
  const pickImportHome = (id) => { setImportHomeId(id); importHomeRef.current = id; };
  // Shared by Dropbox + link import: the backend fetches each URL and stores it.
  const addFromUrls = async (items, homeId) => {
    if(!items.length) return;
    const added = []; let failed = 0;
    for(let i=0; i<items.length; i++){
      const it = items[i];
      setDocBusy("Importing " + (i+1) + " of " + items.length + "…");
      try{
        const docId = uid();
        const path = "documents/" + docId + "/" + safeName(it.name);
        const res = await importFromUrl(path, it.url);
        added.push({
          id: docId, home_id: homeId,
          name: stripExt(it.name), category: classifyDoc(it.name),
          path, size: (res && res.size) || it.bytes || 0, mime: (res && res.content_type) || "",
          sourceName: it.name, note: "", createdAt: nowISO(), updatedAt: nowISO(),
        });
      }catch(e){ failed++; log("ERROR","import "+it.name+": "+e.message);
        if(items.length===1) showToast(e.message); }
    }
    setDocBusy("");
    if(added.length) store.saveCollection("documents", [...added, ...(store.data.documents||[])]);
    afterImportForCoverage(added);
    if(added.length || items.length>1)
      showToast(added.length ? added.length + " imported" + (failed ? ", " + failed + " failed" : "") : "Import failed");
  };
  const chooseDropbox = (homeId) => {
    setImportOpen(false);
    if(!(window.Dropbox && window.Dropbox.choose)){
      ensureDropbox().then(()=>showToast("Dropbox is ready, tap Dropbox again")).catch(e=>showToast(e.message));
      return;
    }
    window.Dropbox.choose({
      linkType: "direct", multiselect: true,
      extensions: [".pdf",".png",".jpg",".jpeg",".gif",".webp"],
      success: (files) => addFromUrls(files.map(f => ({ name:f.name, url:f.link, bytes:f.bytes })), homeId),
      cancel: () => {},
    });
  };
  const importLink = (url, name, homeId) => {
    setImportOpen(false);
    addFromUrls([{ name: name || nameFromUrl(url), url }], homeId);
  };

  const saveDoc = (rec) => {
    const list = store.data.documents || [];
    const next = list.map(d => d.id===rec.id ? rec : d);
    store.saveCollection("documents", next);
    setDocSheet(null);
    showToast("Document updated");
  };
  const deleteDoc = (d) => {
    store.saveCollection("documents", (store.data.documents||[]).filter(x => x.id !== d.id));
    if(d.path) deleteFile(d.path);
    setDocSheet(null);
    showToast("Document deleted");
  };
  const openDoc = (d) => { openStoredFile(d.path, showToast); };
  // Re-run the filename classifier over this home's documents and re-file them.
  // Fixes an older auto-sort in bulk without re-importing; overwrites categories,
  // so confirm first (it also replaces any manual re-tags).
  const resortDocs = (home) => {
    const docs = store.data.documents || [];
    if(!confirm("Re-file every document for this home using the folder it came from and its filename? This replaces the current categories.")) return;
    let changed = 0;
    const next = docs.map(d => {
      if(d.home_id !== home.id) return d;
      // The FULL relative path, not just the basename: the folder it was filed
      // into is the strongest signal we have and used to be thrown away here.
      const ref = d.sourceName || d.name || "";
      const cat = classifyDoc(ref);
      if(cat !== d.category){ changed++; return { ...d, category: cat, updatedAt: nowISO() }; }
      return d;
    });
    if(changed){ store.saveCollection("documents", next); showToast("Re-filed " + changed + " document" + (changed===1?"":"s")); }
    else showToast("Everything was already filed correctly");
  };
  // Read a document with AI, then cache the result on the doc so re-opening it
  // shows the same facts without paying to re-read. Returns the result to the sheet.
  const extractDoc = async (d) => {
    const res = await extractDocument(d.path);
    const stamped = { ...res, at: nowISO() };
    const list = store.data.documents || [];
    store.saveCollection("documents", list.map(x => x.id===d.id ? {...x, extracted: stamped} : x));
    return stamped;
  };
  // Merge extracted facts onto the document's home. Stores every field under its
  // own key, and fills the profile slots the UI already shows only when empty,
  // so applying twice or over existing data never clobbers what you typed.
  const applyDocFacts = (d, fields) => {
    const homes = store.data.homes || [];
    const home = homes.find(h => h.id === d.home_id);
    if(!home){ showToast("Home not found"); return; }
    const facts = { ...(home.facts||{}) };
    // Profile fields the app shows and the user may have typed: FILL only when
    // empty, never overwrite. (A blanket {...fields} spread was clobbering a
    // typed yearBuilt/sqft/beds/baths, so those are handled one at a time.)
    const fillIfEmpty = (key, val) => {
      if(val!=null && val!=="" && (facts[key]==null || facts[key]==="")) facts[key]=val;
    };
    fillIfEmpty("lastSalePrice", fields.purchasePrice);
    fillIfEmpty("lastSaleDate",  fields.closingDate);
    fillIfEmpty("lotSize",       fields.lotSizeSqft);
    fillIfEmpty("squareFootage", fields.squareFootage);
    fillIfEmpty("yearBuilt",     fields.yearBuilt);
    fillIfEmpty("bedrooms",      fields.bedrooms);
    fillIfEmpty("bathrooms",     fields.bathrooms);
    // Document-only facts (never shown as profile chips) stored under their own
    // keys; these come straight from the closing paperwork, so taking the
    // document value is correct.
    ["purchasePrice","loanAmount","loanType","lender","interestRate","monthlyPayment",
     "closingDate","lotSizeAcres","parcelNumber","legalDescription","propertyAddress"]
      .forEach(k => { if(fields[k]!=null && fields[k]!=="") facts[k]=fields[k]; });
    const patch = { ...home, facts, updatedAt: nowISO() };
    if(fields.closingDate && !home.purchaseDate) patch.purchaseDate = fields.closingDate;
    store.saveCollection("homes", homes.map(h => h.id===home.id ? patch : h));
    showToast("Added to " + home.name);
  };

  // Repeating: roll the due date forward from today. One-time: toggle done/reopen.
  const completeReminder = (r) => {
    const list = store.data.reminders || [];
    let next, msg;
    if(r.repeat && r.every){
      const nd = nextDueFromToday(r);
      next = list.map(x => x.id===r.id ? {...x, dueDate:nd, lastDoneAt:nowISO(), doneAt:null, updatedAt:nowISO()} : x);
      msg = "Done · next due " + fmtDate(nd);
    } else {
      const reopening = !!r.doneAt;
      next = list.map(x => x.id===r.id
        ? {...x, doneAt: reopening ? null : nowISO(), lastDoneAt: reopening ? x.lastDoneAt : nowISO(), updatedAt:nowISO()}
        : x);
      msg = reopening ? "Reopened" : "Marked done";
    }
    store.saveCollection("reminders", next);
    showToast(msg);
  };

  if(!store.authReady){
    return <div className="app"><div className="spin spin-lg"></div></div>;
  }
  if(!store.authed){
    return <AuthScreen />;
  }

  const homes = store.data.homes || [];
  const activeHome = homes.find(h => h.id === store.cfg.activeHomeId) || null;
  const inHome = view === "home" && !!activeHome;   // guard: never "inside" a home that's gone

  return (
    <div className="app">
      {update &&
        <button className="update-bar" onClick={applyUpdate}>
          <span><Icon d={ICONS.sparkle} size={15}/> Update available <b>(v{update.ver||update.build})</b></span>
          <span className="update-go">Refresh</span>
        </button>}

      <div className="topbar">
        <div className="topbar-row">
          {inSettings ? (
            <>
              <div><div className="eyebrow">HomeCaptain</div><h1 className="title">Settings</h1></div>
              <button className="icon-btn" onClick={()=>setInSettings(false)} aria-label="Back"><Icon d={ICONS.back} size={21}/></button>
            </>
          ) : inHome ? (
            <>
              <div style={{display:"flex", alignItems:"center", gap:8, minWidth:0}}>
                <button className="backbtn" onClick={goBack} aria-label={navStack.length ? "Back" : "All homes"}><Icon d={ICONS.back} size={19}/></button>
                <div style={{minWidth:0}}>
                  <div className="eyebrow">{SECTION_LABELS[tab] || "Home"}</div>
                  <h1 className="title" style={{whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{activeHome.name}</h1>
                </div>
              </div>
              <div style={{display:"flex", gap:8, alignItems:"center"}}>
                {(() => {
                  // Reminders live up here now: something due is a notification,
                  // not a place you browse to.
                  const rem = (store.data.reminders||[]).filter(r => r.home_id === activeHome.id && !r.doneAt);
                  const due = rem.filter(r => { const st = remStatus(r); return st === "overdue" || st === "today"; }).length;
                  return (
                    <button className={"icon-btn"+(tab==="remind"?" on":"")} onClick={()=>goTab("remind")} aria-label={due ? due + " reminders due" : "Reminders"} style={{position:"relative"}}>
                      <Icon d={ICONS.bell} size={20}/>
                      {due > 0 && <span className="badge">{due > 99 ? "99+" : due}</span>}
                    </button>
                  );
                })()}
                <button className="icon-btn" onClick={()=>setInSettings(true)} aria-label="Settings"><Icon d={ICONS.gear} size={21}/></button>
              </div>
            </>
          ) : (
            <>
              <div><div className="eyebrow">HomeCaptain</div><h1 className="title">Your homes</h1></div>
              <div style={{display:"flex", gap:8}}>
                <button className="icon-btn" onClick={()=>setSheet({home:null})} aria-label="Add home"><Icon d={ICONS.plus} size={21}/></button>
                <button className="icon-btn" onClick={()=>setInSettings(true)} aria-label="Settings"><Icon d={ICONS.gear} size={21}/></button>
              </div>
            </>
          )}
        </div>
        <div className={"sync "+store.sync}>
          <span className="dot"></span>
          {store.sync==="idle" && "All changes saved"}
          {store.sync==="busy" && "Syncing..."}
          {store.sync==="pending" && "Offline - will sync"}
          {store.sync==="error" && (store.syncMsg || "Sync error")}
        </div>
      </div>

      <div className="screen">
        {inSettings
          ? <SettingsScreen store={store} onCheckUpdate={checkUpdate} updMsg={updMsg} update={update} onApplyUpdate={applyUpdate} />
          : inHome
            ? (
                tab==="overview" ? <HomeOverview store={store} home={activeHome} onEdit={()=>setSheet({home:activeHome})} onGoto={goTab} onOpenJob={(j)=>setJobSheet({job:j})} onPickPhoto={()=>pickHomePhoto(activeHome.id)} onRemovePhoto={()=>removeHomePhoto(activeHome.id)} />
              : tab==="docs"     ? <DocsScreen store={store} home={activeHome} onAdd={openImport} onEdit={(d)=>setDocSheet({doc:d})} onOpen={openDoc} onResort={()=>resortDocs(activeHome)}
                                     onDelete={(d)=>{ if(confirm("Delete this document? The file is removed from storage.")) deleteDoc(d); }} />
              : tab==="log"      ? <LogScreen store={store} home={activeHome} onAdd={()=>setEventSheet({event:null})} onEdit={(e)=>setEventSheet({event:e})}
                                     onAddReceipt={pickReceipt} onImportTrello={pickTrello}
                                     onClearImportedDates={clearImportedDates}
                                     onOpenJob={(j)=>setJobSheet({job:j})} onNewJob={()=>setJobSheet({job:null})}
                                     onDeleteJob={(j)=>{ if(confirm("Delete this issue? Its log entries are kept.")) deleteJob(j); }}
                                     onDelete={(e)=>{ if(confirm("Delete this log entry?")) deleteEvent(e.id); }} />
              : tab==="coverage" ? <CoverageScreen store={store} home={activeHome}
                                     onAdd={()=>setCovChooser(true)} onEdit={(p)=>setPolSheet({policy:p})}
                                     onDelete={(p)=>{ if(confirm("Delete this coverage record?")) deletePolicy(p); }} />
              : (tab==="systems" || tab==="vendors" || tab==="notes")
                                 ? <SystemsScreen store={store} home={activeHome} view={tab}
                                     onAdd={()=>setSysSheet({system:null, kind: tab==="vendors" ? "vendor" : tab==="notes" ? "note" : "equipment"})}
                                     onEdit={(s)=>setSysSheet({system:s})}
                                     onImportTrello={pickTrello} onOrganize={()=>runOrganize(activeHome)}
                                     onDelete={(s)=>{ if(confirm("Delete this entry?")) deleteSystem(s); }} />
              :                    <RemindersScreen store={store} home={activeHome}
                                     onAdd={(preset)=>setRemSheet({reminder:null, preset:preset||null})}
                                     onEdit={(r)=>setRemSheet({reminder:r, preset:null})}
                                     onComplete={completeReminder}
                                     onClearImportedDates={clearImportedDates}
                                     onDelete={(r)=>{ if(confirm("Delete this reminder?")) deleteReminder(r.id); }} />
              )
            : <HomesScreen store={store} onAdd={()=>setSheet({home:null})} onEnter={enterHome}
                onDelete={(h)=>{ if(confirm("Delete this home? Its logged items stay but lose the link to it.")) deleteHome(h.id); }} />}
      </div>

      {/* Two inputs on purpose. iOS only shows the Photo Library / Take Photo /
          Choose File action sheet when the input ACCEPTS images; with no accept
          it opens the Files browser directly, which is where Dropbox, iCloud and
          Box appear. So the cloud path gets its own input to skip that hop. */}
      <input ref={docFileRef} type="file" multiple style={{display:"none"}} onChange={onDocFiles} />
      <input ref={docPhotoRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={onDocFiles} />
      <input ref={docDirRef} type="file" multiple style={{display:"none"}} onChange={onDocFiles} />
      <input ref={receiptFileRef} type="file" accept="application/pdf,image/*" style={{display:"none"}} onChange={onReceiptFile} />
      <input ref={trelloFileRef} type="file" accept=".json,application/json,text/json,text/plain" style={{display:"none"}} onChange={onTrelloFile} />
      <input ref={homePhotoRef} type="file" accept="image/*" style={{display:"none"}} onChange={onHomePhotoFile} />
      {docBusy && <div className="toast">{docBusy}</div>}

      {importOpen && activeHome &&
        <ImportSheet
          homes={store.data.homes||[]}
          homeId={importHomeId || activeHome.id}
          onHome={pickImportHome}
          showDropbox={!!DROPBOX_APP_KEY}
          onFiles={()=>{ setImportOpen(false); pickDocuments("files"); }}
          onFolder={handleFolder}
          onPhotos={()=>{ setImportOpen(false); pickDocuments("photos"); }}
          onDropbox={()=>chooseDropbox(importHomeId || activeHome.id)}
          onLink={(url,name)=>importLink(url, name, importHomeId || activeHome.id)}
          singleFile={coverageIntent.current}
          onClose={()=>{ coverageIntent.current = false; setImportOpen(false); }} />}

      {!inSettings && inHome &&
        <nav className="nav">
          {HOME_TABS.slice(0,2).map(t => (
            <button key={t.key} className={"nav-btn "+(tab===t.key?"on":"")} onClick={()=>goTab(t.key)}>
              <Icon d={t.icon} size={22}/>
              {t.label}
            </button>
          ))}
          <button className="nav-add" onClick={()=>setAddSheet(true)} aria-label="Add">
            <span><Icon d={ICONS.plus} size={24}/></span>
          </button>
          {HOME_TABS.slice(2).map(t => (
            <button key={t.key} className={"nav-btn "+(tab===t.key?"on":"")} onClick={()=>goTab(t.key)}>
              <Icon d={t.icon} size={22}/>
              {t.label}
            </button>
          ))}
        </nav>}

      {addSheet && activeHome &&
        <AddSheet
          onLog={()=>{ setAddSheet(false); setEventSheet({event:null}); }}
          onReminder={()=>{ setAddSheet(false); setRemSheet({reminder:null, preset:null}); }}
          onDocs={()=>{ setAddSheet(false); openImport(); }}
          onNote={()=>{ setAddSheet(false); setSysSheet({system:null}); }}
          onIssue={()=>{ setAddSheet(false); setJobSheet({job:null}); }}
          onTrello={()=>{ setAddSheet(false); pickTrello(); }}
          onClose={()=>setAddSheet(false)} />}

      {sheet &&
        <HomeSheet home={sheet.home} onSave={saveHome} onDelete={deleteHome} onClose={()=>setSheet(null)} />}

      {eventSheet && activeHome &&
        <EventSheet event={eventSheet.event} draft={eventSheet.draft} homeId={activeHome.id}
          systems={(store.data.systems||[]).filter(x => x.home_id === activeHome.id)}
          documents={(store.data.documents||[]).filter(x => x.home_id === activeHome.id)}
          onCreateSystem={createSystemQuick} onAttachReceipt={attachReceiptFile}
          onSave={saveEvent} onDelete={deleteEvent} onClose={()=>setEventSheet(null)} />}

      {trelloReview &&
        <TrelloReviewSheet review={trelloReview} onImport={importTrelloEntries} onClose={()=>setTrelloReview(null)} />}

      {jobSheet && activeHome &&
        <JobSheet job={jobSheet.job} homeId={activeHome.id}
          homes={store.data.homes||[]}
          systems={store.data.systems||[]}
          policies={store.data.policies||[]}
          history={jobSheet.job ? (store.data.events||[]).filter(e => e.job_id === jobSheet.job.id)
            .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))) : []}
          onCreateSystem={createSystemQuick}
          onSave={saveJob} onDelete={deleteJob} onLogVisit={logVisitForJob}
          onLogReceipt={pickReceiptForJob}
          onEditEntry={(e)=>{ setJobSheet(null); setEventSheet({ event:e }); }}
          onClose={()=>setJobSheet(null)} />}

      {covChooser && activeHome &&
        <CoverageChooser
          onFromDocs={()=>{ setCovChooser(false); setDocPicker(true); }}
          onUpload={()=>{ coverageIntent.current = true; setCovChooser(false); openImport(); }}
          onManual={()=>{ setCovChooser(false); setPolSheet({policy:null}); }}
          onClose={()=>setCovChooser(false)} />}

      {docPicker && activeHome &&
        <DocPickerSheet docs={(store.data.documents||[]).filter(d => d.home_id === activeHome.id)}
          onPick={readPolicyDoc} onClose={()=>setDocPicker(false)} />}

      {polSheet && activeHome &&
        <PolicySheet policy={polSheet.policy} homeId={activeHome.id}
          prefill={polSheet.prefill} sourceDoc={polSheet.sourceDoc}
          onSave={savePolicy} onDelete={deletePolicy} onClose={()=>setPolSheet(null)} />}

      {organize && activeHome &&
        <OrganizeSheet review={organize} onApply={applyOrganize} onClose={()=>setOrganize(null)} />}

      {sysSheet && activeHome &&
        <SystemSheet system={sysSheet.system} homeId={activeHome.id} presetKind={sysSheet.kind}
          siblings={(store.data.systems||[]).filter(x => x.home_id === activeHome.id)}
          history={sysSheet.system ? (store.data.events||[]).filter(e => e.system_id === sysSheet.system.id).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))) : []}
          onEditEntry={(e)=>{ setSysSheet(null); setEventSheet({ event:e }); }}
          onSave={saveSystem} onDelete={deleteSystem} onClose={()=>setSysSheet(null)} />}

      {remSheet && activeHome &&
        <ReminderSheet reminder={remSheet.reminder} preset={remSheet.preset} homeId={activeHome.id}
          onSave={saveReminder} onDelete={deleteReminder} onClose={()=>setRemSheet(null)} />}

      {docSheet &&
        <DocSheet doc={docSheet.doc}
          homeName={((store.data.homes||[]).find(h=>h.id===docSheet.doc.home_id)||{}).name || ""}
          onSave={saveDoc} onDelete={deleteDoc} onOpen={openDoc}
          onExtract={extractDoc} onApply={applyDocFacts} onClose={()=>setDocSheet(null)} />}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Offline service worker. Relative path, so its scope is this app's subpath
// (/homecaptain-app/). Needs https or localhost; skipped silently elsewhere.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(() => log("SW","registered"))
      .catch(e => log("ERROR","sw register: "+e.message));
  });
}
</script>
</body>
</html>
